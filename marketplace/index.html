<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F2A3F">
<title>سوق الشطرة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#12202E;--mut:#5F6E7E;--line:#DFE5EC;--navy:#0F2A3F;--gold:#F2B33D;--ok:#14866D;--bad:#C0392B;--tile:#E7EDF3}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1620;--card:#132433;--ink:#EAF0F6;--mut:#9AABBD;--line:#22384B;--navy:#0A1B29;--ok:#3CC9A5;--bad:#F0776B;--tile:#1B3246}}
*,*::before,*::after{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6}
button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none}button:disabled{opacity:.5;cursor:default}a{color:var(--ok)}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.shell{max-width:520px;margin:auto;min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}.top{background:var(--navy);color:#fff;border-radius:0 0 28px 28px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px}.top .wrap{padding:0;display:block}.top h1{font-size:22px;margin:0;display:flex;align-items:center;gap:10px}.top h1 svg{width:34px;height:34px}
.nav{position:fixed;z-index:3;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}.nav button{min-height:56px;padding:8px 2px;color:var(--mut);font-size:14px}.nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--gold)}
.wrap{padding:0 16px}main.wrap{margin-top:-20px;position:relative}main>h2{font-size:19px;margin:22px 0 8px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.panel h2{font-size:19px;margin:0 0 6px}.panel p{margin:6px 0 10px}.muted,.small{color:var(--mut)}.small{font-size:13px}
input,textarea,select{width:100%;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0}input[type=file]{max-width:100%}label{display:block;font-size:14px;color:var(--mut);margin-top:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:0}.row input,.row select{min-width:130px}
main button:not(.card){border-radius:12px;background:var(--navy);color:#fff;padding:10px 15px;min-height:42px}main button.gold,.gold{background:var(--gold)!important;color:#3A2A00!important;font-weight:700}main button.quiet{background:var(--tile);color:var(--ink)}main button.danger{background:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{display:flex;flex-direction:column;text-align:start;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;color:var(--ink)}.card img,.card>div:first-child{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--tile);display:grid;place-items:center}.card h3{font-size:16px;margin:8px 0 2px}.price,.ok{color:var(--ok);font-weight:700}.card .price{margin-top:auto}.tag{background:var(--tile);border-radius:999px;padding:3px 9px;font-size:13px}.item{border-top:1px solid var(--line);padding:12px 0}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.hero h2{margin:0}.error{color:var(--bad)}.preview{max-width:100%;max-height:230px;object-fit:contain}#notice{position:fixed;z-index:4;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:16px;right:16px;max-width:488px;margin:auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px;text-align:center}#notice[hidden]{display:none}
@media(max-width:370px){.nav button{font-size:12px}.row>*{flex-basis:100%}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="wrap"><h1><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 18l4-10h28l4 10z" fill="#F2B33D"/><path d="M8 18v22h32V18" fill="none" stroke="#F2B33D" stroke-width="3"/><rect x="19" y="26" width="10" height="14" fill="#F2B33D"/></svg>سوق الشطرة</h1></div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<nav class="nav" id="nav" aria-label="التنقل"><button data-view="home">السوق</button><button data-view="cart">السلة <span id="cart-count">0</span></button><button data-view="orders">طلباتي</button><button data-view="account">حسابي</button></nav>
</div>
<div id="notice" role="status" hidden></div>
<script type="module" src="./app.js"></script>
</body></html>

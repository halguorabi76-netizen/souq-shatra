<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a3c"><title>سوق الشطرة</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#182c3a;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 15px;background:#123e53;color:white}button:disabled{opacity:.5}input,textarea,select{width:100%;border:1px solid #cad5dd;border-radius:10px;padding:11px;background:white}label{display:block;margin:12px 0 5px;font-weight:bold}.wrap{max-width:1050px;margin:auto;padding:16px}.top{background:#102a3c;color:white}.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h1{font-size:23px;margin:0}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{background:#294b5b}.nav button.on,.gold{background:#e8ad39;color:#241b08}.panel{background:white;border:1px solid #dee6eb;border-radius:16px;padding:18px;margin:16px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.muted{color:#5b6b76}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.card{background:white;border:1px solid #dbe4e9;border-radius:14px;padding:12px;cursor:pointer;text-align:right;color:inherit}.card img{width:100%;height:160px;object-fit:cover;border-radius:10px;background:#e5ecf0}.card h3{margin:6px 0}.price{color:#08745a;font-weight:bold}.tag{background:#e4edf1;padding:4px 10px;border-radius:20px;font-size:13px}.small{font-size:13px}.item{border-top:1px solid #e0e6ea;padding:12px 0}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.hero h2{margin:0}.danger{background:#a83232}.quiet{background:#e9eef1;color:#173243}.error{color:#a52e2e}.ok{color:#08745a}.preview{max-width:100%;max-height:230px;object-fit:contain}.hidden{display:none!important}#notice{position:fixed;bottom:10px;left:10px;right:10px;max-width:600px;margin:auto;background:#102a3c;color:white;padding:13px;border-radius:12px;z-index:2}a{color:#076c72}@media(max-width:550px){.wrap{padding:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card img{height:120px}.row>*{flex-basis:100%}}
</style></head><body>
<header class="top"><div class="wrap"><h1>🛍️ سوق الشطرة</h1><nav class="nav" id="nav"><button data-view="home">السوق</button><button data-view="cart">السلة <span id="cart-count">0</span></button><button data-view="orders">طلباتي</button><button data-view="account">حسابي</button></nav></div></header>
<main class="wrap" id="app" aria-live="polite"></main><div id="notice" role="status" hidden></div>
<script type="module" src="./app.js"></script></body></html>

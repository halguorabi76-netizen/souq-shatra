<script>
(()=>{
 const key='souq-shatra-theme';
 const set=(mode,persist=true)=>{
  mode=mode==='dark'?'dark':'light';document.documentElement.dataset.theme=mode;
  if(persist)try{localStorage.setItem(key,mode)}catch{}
  const toggle=document.getElementById('themeToggle');if(toggle){const label=mode==='dark'?'تفعيل الوضع الفاتح':'تفعيل الوضع الغامق';toggle.setAttribute('aria-label',label);toggle.title=label}
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta&&!document.body?.classList.contains('starting'))meta.content=mode==='dark'?'#0e0e0e':'#ffffff';
 };
 let saved='light';try{saved=localStorage.getItem(key)||'light'}catch{}
 window.SouqTheme={set,get:()=>document.documentElement.dataset.theme};set(saved,false);
})();
</script>

<script>
(()=>{
  const splash=document.getElementById('startupSplash');
  const themeMeta=document.querySelector?.('meta[name="theme-color"]');
  const originalTheme=themeMeta?.content;
  let done=false,playing=false,timer=0;
  const finish=()=>{if(done)return;done=true;splash.hidden=true;document.body.classList.remove('starting');if(themeMeta)themeMeta.content=originalTheme;try{sessionStorage.setItem('souq-splash-done','1')}catch{}};
  if(document.documentElement.dataset.embeddedPreview==='true')return;
  // A reload in the same session goes straight back to the page; the animation is for opening the app.
  try{if(sessionStorage.getItem('souq-splash-done'))return}catch{}
  splash.hidden=false;document.body.classList.add('starting');
  if(themeMeta)themeMeta.content='#3547a5';
  // River 0.6–1.8s, then the name is written while the pin drops (1.9–3.3s); the page follows at 4s.
  const play=()=>{
    splash.classList.remove('play','leaving');void splash.offsetWidth;splash.classList.add('play');playing=true;
    clearTimeout(timer);timer=setTimeout(()=>{splash.classList.add('leaving');setTimeout(finish,350)},4000);
  };
  // Start only once the page has loaded and is on screen, so the phone's own launch screen never hides the animation.
  const start=()=>{if(playing||done)return;if(document.visibilityState==='hidden'){document.addEventListener('visibilitychange',start,{once:true});return}play()};
  window.addEventListener('load',start,{once:true});
  setTimeout(start,2500);
  // A tap skips the animation and opens the site at once, for people who open the app many times a day.
  const skip=()=>{if(done)return;clearTimeout(timer);splash.classList.add('leaving');setTimeout(finish,180)};
  splash.addEventListener('click',skip);
  setTimeout(finish,15000);
  window.addEventListener('pageshow',event=>{if(event.persisted)finish()});
})();

async function acceptSellerOrder(id,button){
 const order=D.o.find(o=>o.id===id);if(!order||!user)return;
 const identity=user.id,busy=acceptSellerOrder.busy||(acceptSellerOrder.busy=new Set());
 if(busy.has(id))return;
 if(order.st!==0){A.close();render();toast('تم قبول الطلب بالفعل');return;}
 busy.add(id);if(button){button.disabled=true;button.textContent='جارٍ قبول الطلب…';}
 try{
  check(await withTimeout(db.rpc('set_order_status',{p_order:id,p_status:'accepted'})));
  if(user?.id!==identity)return;
  // RPC success confirms acceptance; do not wait for unrelated market requests.
  D.o=D.o.map(o=>o.id===id?{...o,st:1}:o);A.close();render();toast('تم قبول الطلب وإبلاغ الزبون');
  activity.poll().catch(()=>{});
  withTimeout(orderRead().eq('id',id).single()).then(result=>{
   if(user?.id!==identity)return;const row=check(result);
   const updated={...fromOrder(row),buyer_id:row.buyer_id,driver_id:row.driver_id,platform_fee:row.platform_fee||0,delivery_fee:row.delivery_fee||0};
   D.o=D.o.map(o=>o.id===id?updated:o);render();
  }).catch(()=>{window.SouqLoading?.recovered?.();});
 }finally{busy.delete(id);if(button?.isConnected){button.disabled=false;button.textContent='قبول الطلب';}}
}

async function waPoll(){
 const r=waRequest;if(!r)return;
 // Keeps waiting even if the sheet was closed: the customer may still send the code.
 if(Date.now()>r.until){waStop();return}
 const result=await claimWhatsappLogin(db,r.code,r.secret).catch(()=>({data:{status:'pending'}}));
 if(waRequest!==r)return;
 if(result.error){waStop();toast(result.error.message);return}
 if(result.data?.status==='pending'){waTimer=setTimeout(waTick,2500);return}
 if(result.data?.status==='expired'){waStop();const s=$('#waLogin .wa-status');if(s)s.textContent='انتهت مهلة الرمز؛ ارجع واطلب رمزًا جديدًا';return}
 waStop();
 const signedIn=check(result).user;
 dataReady=false;accountResolving=true;user=signedIn;rememberMode('buyer');profile=null;ownStore=null;
 const joining=waMode==='new'&&waDraft?.join&&waDraft.join!=='buyer'?{...waDraft}:null;
 if(waMode==='new')await waApplyDraft(signedIn?.id);
 if(pendingPurchase){await refresh();toast('تم الدخول؛ يمكنك متابعة شراء المادة');return}
 dt='m';tab='market';A.close();render();toast('تم الدخول عبر واتساب');
 await refresh();
 if(joining)await waSubmitJoin(joining);
}
// The join request reaches the admin page (with a bell notice); WhatsApp to support is offered too.
async function sendJoinRequest(openWhatsapp=true){
 waCapture();const d=waDraft||{},note=$('#waJoinNote'),say=t=>{if(note){note.textContent=t;note.hidden=false}else toast(t)};
 if((d.name||'').trim().split(/\s+/).length<2){say('اكتب اسمك الكامل أولًا');$('#waName')?.focus();return}
 if(!/^07[0-9]{9}$/.test(d.phone||'')){say('اكتب رقم هاتفك الصحيح أولًا');$('#waPhone')?.focus();return}
 const zone=waZones().find(z=>z[0]===d.zone)?.[1]||'';
 const details={zone,address:(d.addr||'').trim(),store_name:d.storeName||'',store_kind:d.storeKind||'',store_desc:d.storeDesc||'',vehicle:d.vehicle||'',...(d.point?{lat:d.point.lat,lon:d.point.lon}:{})};
 const r=await db.rpc('request_professional_join',{p_phone:d.phone,p_role:d.join,p_name:d.name.trim(),p_details:details});
 if(r.error){say(/busy/.test(r.error.message)?'طلبات كثيرة الآن؛ حاول بعد قليل':'تعذّر إرسال الطلب؛ تحقق من الاتصال');return}
 say(r.data==='approved'?'✅ رقمك موافَق عليه! أكمل بياناتك واضغط «أكّد رقمك وافتح حسابك».':'✅ وصل طلبك للإدارة. ستتواصل معك الإدارة، وبعد الموافقة أكمل التسجيل من هنا.');
 // A link the person taps themselves (opening WhatsApp after a network wait would be blocked by phones).
 if(openWhatsapp&&r.data!=='approved'&&note)note.insertAdjacentHTML('beforeend',`<a class="wa-join-wa" href="${SUPPORT_WHATSAPP}?text=${encodeURIComponent('مرحبًا، أرسلت طلب انضمام إلى سوق الشطرة '+(d.join==='seller'?'كبائع':'كسائق توصيل')+'. الاسم: '+d.name.trim()+' · رقمي: '+d.phone)}" target="_blank" rel="noopener">✆ راسل الدعم على واتساب لتسريع الموافقة</a>`);
}

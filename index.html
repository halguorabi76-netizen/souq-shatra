<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3D195F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="سوق الشطرة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>سوق الشطرة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#12202E;--mut:#5F6E7E;--line:#DFE5EC;--navy:#0F2A3F;--gold:#F2B33D;--gi:#3A2A00;--ok:#14866D;--bad:#C0392B;--tile:#E7EDF3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1620;--card:#132433;--ink:#EAF0F6;--mut:#9AABBD;--line:#22384B;--navy:#0A1B29;--ok:#3CC9A5;--bad:#F0776B;--tile:#1B3246}}
:root[data-theme="dark"]{--bg:#0B1620;--card:#132433;--ink:#EAF0F6;--mut:#9AABBD;--line:#22384B;--navy:#0A1B29;--ok:#3CC9A5;--bad:#F0776B;--tile:#1B3246}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--ok)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.top{background:var(--navy);color:#fff;padding:16px 16px 42px;border-radius:0 0 28px 28px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
.ib{position:relative;font-size:22px;padding:6px 10px;background:rgba(255,255,255,.1);border-radius:12px}
#cc{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--gold);color:var(--gi);font:700 12px/1 sans-serif;border-radius:999px;min-width:20px;padding:4px 5px;text-align:center;font-style:normal}
.search{margin:-24px 16px 0}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:4px}
.search input{background:var(--card);padding:13px 16px;margin:0;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
label{display:block;font-size:14px;color:var(--mut);margin-top:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:15px}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:start;display:flex;flex-direction:column;gap:2px}
.tile{width:100%;aspect-ratio:1;border-radius:12px;background:var(--tile);display:grid;place-items:center;font-size:44px;overflow:hidden;margin-bottom:6px}
.tile img{width:100%;height:100%;object-fit:cover}
.p b{font-size:16px}.p span{color:var(--mut);font-size:13px}
.p em{font-style:normal;color:var(--ok);font-weight:700}
.p u{text-decoration:none;color:var(--bad);font-size:13px}
.empty{padding:40px 24px;text-align:center;color:var(--mut)}
.box{margin:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.box h2,.sh h2{margin:0 0 4px;font-size:19px}
.box p{color:var(--mut);margin:0 0 8px}
.buy,.alt{display:block;width:100%;margin-top:10px;font-weight:700;font-size:16px;padding:13px;border-radius:14px}
.buy{background:var(--gold);color:var(--gi)}
.buy:disabled{opacity:.5}
.alt{border:1.5px solid var(--line)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0}
.link{color:var(--bad)}
.item{display:flex;gap:12px;align-items:center;margin:10px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.item .tile{width:56px;flex:none;font-size:26px;margin:0}
.item>div:nth-child(2){flex:1;min-width:0}
.item small,.ord small{color:var(--mut);display:block}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button{border:1.5px solid var(--line);border-radius:10px;padding:5px 12px;font-size:14px}
.acts .go{background:var(--ok);border-color:var(--ok);color:#fff}
.ord{margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ord .r{display:flex;justify-content:space-between;gap:8px}
.pill{display:inline-block;font-size:13px;padding:1px 10px;border-radius:999px;background:var(--tile)}
.s0{background:color-mix(in srgb,var(--gold) 30%,transparent)}.s3{background:color-mix(in srgb,var(--ok) 25%,transparent)}.s4{background:color-mix(in srgb,var(--bad) 22%,transparent)}
.tabs{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{padding:12px;color:var(--mut);font-size:15px}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--gold)}
.shade{position:fixed;inset:0;background:rgba(5,12,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.shade[hidden]{display:none}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh{display:flex;align-items:center;justify-content:space-between}
.x{font-size:22px;color:var(--mut);padding:4px 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line);font-size:19px}
.big{max-width:240px;margin:10px auto}
.note{color:var(--mut);font-size:13px;margin:8px 0 0}.bad{color:var(--bad)}
.done{text-align:center}.ck{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;display:grid;place-items:center;margin:8px auto}
#toast{position:fixed;inset-inline:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:9;text-align:center}
#toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>
<style>
/* واجهة سوق الشطرة البنفسجية */
:root,:root[data-theme="dark"]{--bg:#F8F6FC;--card:#fff;--ink:#271D38;--mut:#776D85;--line:#E8E1F0;--navy:#3D195F;--gold:#71349C;--gi:#fff;--ok:#64338A;--tile:#F0EAF7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#F8F6FC;--card:#fff;--ink:#271D38;--mut:#776D85;--line:#E8E1F0;--navy:#3D195F;--gold:#71349C;--gi:#fff;--ok:#64338A;--tile:#F0EAF7}}
body{background:#F2EEF8}.app{background:var(--bg);padding-bottom:calc(108px + env(safe-area-inset-bottom,0px));box-shadow:0 0 35px #30134112}
.top{display:block;background:linear-gradient(140deg,#33104D,#5D247C);padding:18px 18px 24px;border-radius:0 0 28px 28px;box-shadow:0 8px 25px #35125222}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:26px;letter-spacing:-.7px;white-space:nowrap}.brand svg{width:32px;height:32px}
.top-actions{display:flex;gap:8px}.ib{font-size:21px;min-width:42px;min-height:42px;display:grid;place-items:center;background:#ffffff27;color:#fff}
.wordmark{display:block;font-size:19px;line-height:1.1;font-weight:700;margin-top:20px;color:#fff;text-align:left}.wordmark small{display:block;font-size:11px;letter-spacing:3px;opacity:.75}
.search{margin:12px 16px 0}.searchline{display:flex;gap:8px;align-items:center}.search input{flex:1;min-width:0;border:1px solid var(--line);box-shadow:none;border-radius:16px}.filter-btn{flex:none;width:52px;height:52px;border-radius:16px;background:var(--navy);color:#fff;font-size:24px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 16px 12px}.section-title h2{margin:0;font-size:20px}.section-title button{color:var(--ok);font-weight:700}
.category-cards{display:flex;gap:10px;padding:0 16px 5px;overflow-x:auto;scrollbar-width:none}.category-cards::-webkit-scrollbar{display:none}
.category-card{flex:0 0 116px;min-height:116px;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;padding:12px;font-weight:700;box-shadow:0 5px 15px #3914530a}.category-card span{font-size:31px}.category-card[aria-pressed="true"]{border-color:var(--gold);background:#EFE5F8}
.grid{gap:12px}.p{border-radius:18px;box-shadow:0 6px 18px #36174b0c}.tile{border-radius:14px}.p em{color:var(--navy);font-size:17px}.p b{line-height:1.4}
.tabs{grid-template-columns:repeat(5,1fr);border-radius:22px 22px 0 0;box-shadow:0 -7px 28px #30134115;border-top:0;min-height:78px;z-index:3}.tabs button{font-size:11px;padding:9px 2px 7px;line-height:1.3}.tabs .navicon{display:block;font-size:21px;line-height:1.5}.tabs button[aria-current="page"]{color:var(--gold);box-shadow:none}.tabs button[aria-current="page"]::before{content:"";display:block;position:absolute;top:0;width:32px;height:3px;background:var(--gold);border-radius:0 0 8px 8px}.tabs button{position:relative}.tabs .plus{width:54px;height:54px;border-radius:50%;background:var(--gold);color:#fff;font-size:34px;line-height:1;margin:-26px auto 4px;display:grid;place-items:center;border:4px solid var(--card);box-shadow:0 5px 14px #3211513b}.tabs button[aria-current="page"] .plus{background:var(--navy)}
.sheet{border-radius:26px 26px 0 0}.sh{border-bottom:1px solid var(--line);padding-bottom:10px}.sh h2{font-size:21px}.filter-group{margin:20px 0}.filter-group h3{font-size:16px;margin:0 0 10px}.filter-chips{display:flex;gap:8px;flex-wrap:wrap}.filter-chips button{padding:8px 13px;border-radius:999px;background:var(--tile);border:1px solid var(--line)}.filter-chips button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}.filter-range{display:flex;gap:10px}.filter-range label{flex:1;min-width:0}.filter-actions{display:flex;gap:10px;position:sticky;bottom:-18px;background:var(--card);padding:12px 0}.filter-actions button{margin:0}.faq details{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}.faq summary{cursor:pointer;font-weight:700}.faq p{color:var(--mut);margin:8px 0 0}.info-tabs{display:flex;gap:8px;margin:14px 0}.info-tabs button{flex:1;padding:10px;border-radius:12px;background:var(--tile)}.info-tabs button[aria-pressed="true"]{background:var(--gold);color:white}
.account-head{background:linear-gradient(125deg,#4A1D6C,#73409A);color:#fff;margin:16px;border-radius:20px;padding:20px}.account-head small{display:block;opacity:.8}.account-shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px}.account-shortcuts button{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:16px;text-align:center}.loading-buddy{width:80px;height:80px;margin:0 auto 12px;background:#E8D8F3;border-radius:27px;display:grid;place-items:center;position:relative;animation:bob 1.6s ease-in-out infinite}.loading-buddy:before{content:"";width:46px;height:37px;background:#64338A;border-radius:12px 12px 18px 18px;position:absolute;top:18px}.loading-buddy:after{content:"•  •";color:#fff;font-size:23px;letter-spacing:3px;position:absolute;top:15px}.loading-buddy span{position:absolute;bottom:10px;font-size:13px;color:#64338A}.loading-buddy.still{animation:none}@keyframes bob{50%{transform:translateY(-6px)}}
.loading-overlay{position:fixed;inset:0;background:#f8f6fcdd;z-index:8;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--navy)}.loading-overlay[hidden]{display:none}
.empty{padding:55px 24px}.box,.ord,.item{box-shadow:0 5px 15px #3914530a}.buy{background:var(--gold);color:#fff}
@media(max-width:360px){.brand{font-size:20px}.top-actions{gap:3px}.ib{min-width:36px}.tabs button{font-size:10px}.tabs .navicon{font-size:18px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="topline"><div class="brand">سوق الشطرة</div><div class="top-actions"><button class="ib" data-a="info" aria-label="عن سوق الشطرة">ⓘ</button><button class="ib" data-a="notifications" aria-label="الإشعارات">♧</button><button class="ib" data-a="searchfocus" aria-label="البحث">⌕</button><button class="ib" data-a="cart" aria-label="السلة">🛒<i id="cc" hidden></i></button></div></div><span class="wordmark">سوق الشطرة<small>سوقنا يجمعنا</small></span></header>
  <div class="search" id="sb"><div class="searchline"><input id="q" type="search" placeholder="ابحث عن منتج..." aria-label="بحث"><button class="filter-btn" data-a="filters" aria-label="تصفية البحث">☷</button></div></div>
  <main id="view"></main>
  <nav class="tabs" aria-label="التنقل">
    <button data-a="tab" data-v="market"><span class="navicon">⌂</span>الرئيسية</button>
    <button data-a="tab" data-v="chats"><span class="navicon">▣</span>محادثات</button>
    <button data-a="addentry"><span class="plus">+</span>إضافة إعلان</button>
    <button data-a="tab" data-v="listings"><span class="navicon">▤</span>إعلاناتي</button>
    <button data-a="tab" data-v="account"><span class="navicon">♙</span>حسابي</button>
  </nav>
</div>
<div class="shade" id="shade" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="loading" class="loading-overlay" hidden role="status"><div class="loading-buddy"><span>✦</span></div><b>لحظة، نجهز سوق الشطرة…</b></div>
<div id="toast" hidden role="status"></div>

<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.0";
import {SUPABASE_URL,SUPABASE_ANON_KEY} from "./config.js";
async function apiFetch(resource,init={}){
  const controller=new AbortController(),source=init.signal||resource?.signal;
  const abort=()=>controller.abort();
  if(source?.aborted)abort();else source?.addEventListener('abort',abort,{once:true});
  const timer=setTimeout(abort,20000);
  try{return await fetch(resource,{...init,signal:controller.signal})}
  finally{clearTimeout(timer);source?.removeEventListener('abort',abort)}
}
const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{global:{fetch:apiFetch}});
/* طبقة التخزين: حالياً في متصفح الجهاز. عند الانتقال لتطبيق حقيقي تُستبدل بقاعدة بيانات (Firebase / Supabase). */
const KEY='souq-shatra-online';
const local=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')||{}}catch{return {}}})();
let D={m:[],p:[],o:[],cart:Array.isArray(local.cart)?local.cart:[],me:null,comm:10,opin:'',cust:local.cust||{name:'',phone:'',addr:''}};
let user=null,profile=null,ownStore=null,refreshId=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({cart:D.cart,cust:D.cust}))}catch{toast('تعذّر حفظ السلة على هذا الجهاز')}};
const check=r=>{if(r.error)throw r.error;return r.data};
function error(e){toast(e?.name==='AbortError'?'انتهت مهلة الاتصال. تحقق من الإنترنت وأعد المحاولة.':'تعذّر إكمال العملية: '+(e?.message||e))}
const STCODE=['new','accepted','delivery','delivered','cancelled'];
const fromOrder=o=>({id:o.id,mid:o.store_id,items:(o.order_items||[]).map(i=>({pid:i.product_id,name:i.product_name,price:i.price,q:i.quantity})),total:o.total,st:Math.max(0,STCODE.indexOf(o.status)),ts:o.created_at,cust:{name:o.customer_name,phone:o.customer_phone,addr:o.address,note:o.note}});
async function refresh(){
  const id=++refreshId;
  $('#loading').hidden=false;
  try{
  const session=check(await db.auth.getSession());
  const nextUser=session.session?.user||null;
  const [pr,ms,ps,rs]=await Promise.all([
    nextUser?db.from('profiles').select('*').eq('id',nextUser.id).single():Promise.resolve({data:null,error:null}),
    db.from('stores').select('*'),
    db.from('products').select('*').order('created_at',{ascending:false}),
    nextUser?db.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}):Promise.resolve({data:[],error:null})
  ]);
  const nextProfile=check(pr),stores=check(ms),products=check(ps),orders=check(rs);
  if(id!==refreshId)return;
  user=nextUser;profile=nextProfile;
  D.m=stores.map(m=>({id:m.id,name:m.name,phone:m.phone,ok:m.approved,owner_id:m.owner_id}));
  D.p=products.map(p=>({id:p.id,mid:p.store_id,name:p.name,desc:p.description,cat:p.category,price:p.price,stock:p.stock,img:p.image_path?db.storage.from('products').getPublicUrl(p.image_path).data.publicUrl:'',image_path:p.image_path,active:p.active}));
  ownStore=user?D.m.find(m=>m.owner_id===user.id):null;
  D.me=profile?.role==='admin'?'owner':ownStore?.id||null;
  D.o=orders.map(o=>({...fromOrder(o),buyer_id:o.buyer_id}));
  D.cart=D.cart.filter(x=>D.p.some(p=>p.id===x.pid));save();render();
  }finally{if(id===refreshId)$('#loading').hidden=true}
}
async function act(f){try{await f()}catch(e){error(e)}}
const $=s=>document.querySelector(s),fmt=n=>(+n||0).toLocaleString('en-US')+' د.ع';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID();
const CATS=['مواد غذائية','خضار وفواكه','تمور','ملابس','أجهزة','منزلية','أخرى'],CI=['🛒','🥬','🌴','👕','📱','🏠','📦'];
const ST=['جديد','قيد التجهيز','خرج للتوصيل','تم التسليم','ملغي'];
const mrec=id=>D.m.find(x=>x.id===id)||{};
const mname=id=>id==='owner'?(ownStore?.name||'سوق الشطرة'):mrec(id).name||'—';
const mok=id=>id==='owner'||!!mrec(id).ok;
const thumb=p=>p.img&&(p.img.startsWith('data:image/')||p.img.startsWith('https://'))?`<img src="${esc(p.img)}" loading="lazy" decoding="async" alt="">`:CI[CATS.indexOf(p.cat)]||'📦';
const prod=id=>D.p.find(x=>x.id===id);
const sid=o=>'#'+o.id.slice(-4).toUpperCase();
const when=t=>new Date(t).toLocaleString('ar-IQ',{dateStyle:'medium',timeStyle:'short'});
let tab='market',cat='all',q='',dt='p',cur=null,infoRole='seller';
const filt={min:'',max:'',sort:'newest',condition:'all',location:''};

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function sheet(h){$('#sheet').innerHTML=h;$('#shade').hidden=false;const c=$('#sheet [data-a="close"]');c&&c.focus()}
const head=t=>`<div class="sh"><h2>${t}</h2><button class="x" data-a="close" aria-label="إغلاق">✕</button></div>`;
const val=id=>($('#'+id)||{}).value?.trim()||'';
const ask=(msg,act,v)=>sheet(head('تأكيد')+`<p>${msg}</p><button class="buy" data-a="${act}" data-v="${v}">نعم</button><button class="alt" data-a="close">تراجع</button>`);

/* ===== الواجهات ===== */
function render(){
  const n=D.cart.reduce((s,c)=>s+c.q,0),cc=$('#cc');cc.textContent=n;cc.hidden=!n;
  document.querySelectorAll('.tabs button').forEach(b=>b.dataset.v===tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  $('#sb').hidden=tab!=='market';
  ({market,orders,account,chats,listings})[tab]();
}
function market(){
  let l=D.p.filter(p=>p.active&&mok(p.mid)&&(cat==='all'||p.cat===cat)&&(p.name+' '+p.desc).toLocaleLowerCase('ar').includes(q.trim().toLocaleLowerCase('ar'))&&(!filt.min||p.price>=+filt.min)&&(!filt.max||p.price<=+filt.max));
  if(filt.sort==='cheap')l.sort((a,b)=>a.price-b.price);else if(filt.sort==='expensive')l.sort((a,b)=>b.price-a.price);else if(filt.sort==='oldest')l.reverse();
  $('#view').innerHTML=`<div class="section-title"><h2>تصفح الأقسام</h2><button data-a="allcat">عرض الكل ‹</button></div><div class="category-cards">${CATS.map((c,i)=>`<button class="category-card" data-a="cat" data-v="${c}" aria-pressed="${c===cat}"><span aria-hidden="true">${CI[i]}</span>${c}</button>`).join('')}</div><div class="section-title"><h2>${q||cat!=='all'?'نتائج البحث':'أحدث الإعلانات'}</h2><span class="note">${l.length} منتج</span></div>`+
  (l.length?`<div class="grid">${l.map(p=>`<button class="p" data-a="prod" data-v="${p.id}"><div class="tile">${thumb(p)}</div><b>${esc(p.name)}</b><span>${esc(mname(p.mid))}</span><em>${fmt(p.price)}</em>${p.stock<1?'<u>نفدت الكمية</u>':''}</button>`).join('')}</div>`:
  `<div class="empty">${D.p.length?'ما لقينا نتيجة. جرّب كلمة ثانية أو تصنيف آخر.':'السوق فاضي حالياً.<br>ادخل من «حسابي» وأضف أول منتج.'}</div>`);
}
function chats(){
  $('#view').innerHTML='<div class="section-title"><h2>المحادثات</h2></div><div class="empty"><div style="font-size:38px" aria-hidden="true">▣</div>لا توجد محادثات حاليًا.<br><small>لم تُفعّل خدمة المحادثات بعد.</small></div>';
}
function listings(){
  if(!user){$('#view').innerHTML='<div class="box"><h2>إعلاناتي</h2><p>سجّل الدخول لعرض منتجاتك وإدارتها.</p><button class="buy" data-a="login" data-v="m">دخول</button></div>';return}
  if(!ownStore){$('#view').innerHTML='<div class="box"><h2>إعلاناتي</h2><p>سجّل متجرك أولًا لتضيف المنتجات. يمكن للأفراد أيضًا التسجيل لعرض ما يريدون بيعه.</p><button class="buy" data-a="login" data-v="store">تسجيل بائع</button></div>';return}
  const mine=D.p.filter(p=>p.mid===ownStore.id);
  $('#view').innerHTML=`<div class="section-title"><h2>إعلاناتي</h2><button data-a="pform" data-v="">إضافة منتج ＋</button></div><div class="chips"><span class="chip">الكل ${mine.length}</span></div>`+(mine.length?mine.map(p=>`<div class="item"><div class="tile">${thumb(p)}</div><div><b>${esc(p.name)}</b><small>${fmt(p.price)} · المتوفر ${p.stock}</small><div class="acts"><button data-a="pform" data-v="${p.id}">تعديل</button><button data-a="pdel" data-v="${p.id}">حذف</button></div></div></div>`).join(''):'<div class="empty">لا توجد إعلانات بعد.</div>');
}
function ordCard(o,m){
  return `<div class="ord"><div class="r"><b>${sid(o)} · ${esc(m?o.cust.name:mname(o.mid))}</b><span class="pill s${o.st}">${ST[o.st]}</span></div><small>${when(o.ts)}</small>
  ${o.items.map(i=>`<div class="r"><span>${esc(i.name)} × ${i.q}</span><span>${fmt(i.price*i.q)}</span></div>`).join('')}
  <div class="r"><b>الإجمالي</b><b>${fmt(o.total)}</b></div>
  ${m?`<small>📞 <a href="tel:${esc(o.cust.phone)}">${esc(o.cust.phone)}</a> · 📍 ${esc(o.cust.addr)}${o.cust.note?' · '+esc(o.cust.note):''}</small>`:''}
  ${o.st<3&&m?`<div class="acts">${m&&o.st<3?`<button class="go" data-a="st" data-v="${o.id}">${['قبول الطلب','خرج للتوصيل','تم التسليم'][o.st]}</button>`:''}${m?`<button data-a="cancel" data-v="${o.id}">إلغاء الطلب</button>`:''}</div>`:''}</div>`;
}
function orders(){
  const l=D.o.filter(o=>user&&o.buyer_id===user.id);
  $('#view').innerHTML='<div class="dh"><h2 style="margin:0">طلباتي</h2></div>'+(l.length?l.map(o=>ordCard(o,false)).join(''):'<div class="empty">ما عندك طلبات بعد.<br>اختر منتجاً من السوق وأرسل طلبك.</div>');
}
function account(){
  if(!user){$('#view').innerHTML=`<div class="box"><h2>حساب سوق الشطرة</h2><p>سجّل الدخول أو أنشئ حساباً للشراء أو لفتح متجر.</p><button class="buy" data-a="login" data-v="m">دخول</button><button class="alt" data-a="login" data-v="r">حساب جديد</button></div>`;return}
  if(!D.me){$('#view').innerHTML=`<div class="account-head"><b>حسابي</b><small>${esc(user.email)}</small></div><div class="account-shortcuts"><button data-a="tab" data-v="orders">🛒<br>طلباتي</button><button data-a="tab" data-v="listings">▤<br>إعلاناتي</button></div><div class="box"><button class="buy" data-a="login" data-v="store">تسجيل بائع</button><button class="alt" data-a="out">خروج</button></div>`;return}
  const me=D.me,own=me==='owner',T=[...(ownStore?[['p','منتجاتي'],['o','الطلبات']]:[]),...(own?[['m','التجار والأرباح']]:[])];
  let h=`<div class="account-head"><b>${esc(mname(me))}</b><small>${esc(user.email)}</small>${mok(me)?'':'<small>بانتظار موافقة الإدارة. منتجاتك لا تظهر بعد.</small>'}</div><div class="account-shortcuts"><button data-a="tab" data-v="orders">🛒<br>طلباتي</button><button data-a="tab" data-v="listings">▤<br>إعلاناتي</button></div><div class="dh"><b>إدارة المتجر</b><button class="link" data-a="out">خروج</button></div><div class="chips">${T.map(t=>`<button class="chip" data-a="dtab" data-v="${t[0]}" aria-pressed="${t[0]===dt}">${t[1]}</button>`).join('')}</div>`;
  const mine=D.p.filter(p=>p.mid===(own?ownStore?.id:me)),mo=D.o.filter(o=>o.mid===(own?ownStore?.id:me));
  if(dt==='p'&&!ownStore)dt='m';
  if(dt==='p')h+=`<div style="padding:0 16px"><button class="buy" style="margin-top:0" data-a="pform" data-v="">＋ إضافة منتج</button></div>`+(mine.length?mine.map(p=>`<div class="item"><div class="tile">${thumb(p)}</div><div><b>${esc(p.name)}</b><small>${fmt(p.price)} · المتوفر ${p.stock}</small><div class="acts"><button data-a="pform" data-v="${p.id}">تعديل</button><button data-a="pdel" data-v="${p.id}">حذف</button></div></div></div>`).join(''):'<div class="empty">ما أضفت منتجات بعد.</div>');
  else if(dt==='o')h+=mo.length?mo.map(o=>ordCard(o,true)).join(''):'<div class="empty">ما وصلتك طلبات بعد.</div>';
  else{
    const dn=D.o.filter(o=>o.st===3),tot=dn.reduce((s,o)=>s+o.total,0),ext=dn.filter(o=>o.mid!=='owner').reduce((s,o)=>s+o.total,0),cm=Math.round(ext*D.comm/100);
    h+=`${!ownStore?'<div class="box"><button class="buy" data-a="login" data-v="store">تسجيل متجر خاص بك</button></div>':''}<div class="box"><div class="row" style="border:0"><span>مبيعات مكتملة</span><b>${fmt(tot)}</b></div><div class="row"><span>مبيعات التجار</span><b>${fmt(ext)}</b></div><div class="row"><span>عمولتك التقديرية (${D.comm}%)</span><b>${fmt(cm)}</b></div><p class="note">النسبة المعروضة تقديرية في هذا الجهاز.</p></div>`+
    (D.m.length?D.m.map(m=>{const s=D.o.filter(o=>o.mid===m.id&&o.st===3).reduce((a,o)=>a+o.total,0);return `<div class="item"><div><b>${esc(m.name)}</b><small>📞 ${esc(m.phone)} · مبيعات ${fmt(s)}</small><div class="acts"><button class="${m.ok?'':'go'}" data-a="mok" data-v="${m.id}">${m.ok?'إيقاف المتجر':'قبول المتجر'}</button></div></div></div>`}).join(''):'<div class="empty">ما سجّل أي تاجر بعد.</div>');
  }
  $('#view').innerHTML=h;
}

/* ===== النوافذ ===== */
function psheet(){
  const {p,n}=cur;
  sheet(head(esc(p.name))+`<div class="tile big">${thumb(p)}</div><h2 style="margin:0">${fmt(p.price)}</h2><p class="note">البائع: ${esc(mname(p.mid))}</p>${p.desc?`<p>${esc(p.desc)}</p>`:''}
  <div class="row"><span>المتوفر ${p.stock}</span><div class="qty"><button data-a="pq" data-v="-1" aria-label="أقل">−</button><b>${n}</b><button data-a="pq" data-v="1" aria-label="أكثر">+</button></div></div>
  <button class="buy" data-a="add" ${p.stock<1?'disabled':''}>${p.stock<1?'نفدت الكمية':'أضف للسلة · '+fmt(p.price*n)}</button>`);
}
function csheet(){
  const it=D.cart.map(c=>({c,p:prod(c.pid)})).filter(x=>x.p),tot=it.reduce((s,x)=>s+x.p.price*x.c.q,0);
  if(!it.length){sheet(head('السلة')+'<div class="empty">السلة فاضية.</div>');return}
  const u=D.cust;
  sheet(head('السلة')+it.map(x=>`<div class="row"><div><b>${esc(x.p.name)}</b><small class="note" style="display:block;margin:0">${esc(mname(x.p.mid))} · ${fmt(x.p.price)}</small></div><div class="qty"><button data-a="cq" data-v="${x.p.id}|-1" aria-label="أقل">−</button><b>${x.c.q}</b><button data-a="cq" data-v="${x.p.id}|1" aria-label="أكثر">+</button></div></div>`).join('')+
  `<div class="row"><b>الإجمالي</b><b>${fmt(tot)}</b></div>
  <label for="cn">الاسم</label><input id="cn" value="${esc(u.name)}" autocomplete="name">
  <label for="cp">رقم الهاتف</label><input id="cp" type="tel" inputmode="numeric" value="${esc(u.phone)}" placeholder="07xxxxxxxxx" autocomplete="tel">
  <label for="ca">العنوان</label><input id="ca" value="${esc(u.addr)}" placeholder="المنطقة، الحي، أقرب نقطة دالة">
  <label for="cno">ملاحظات (اختياري)</label><input id="cno">
  <button class="buy" data-a="order">إرسال الطلب · الدفع عند الاستلام</button>`);
}
function lsheet(m){
  if(m==='store'){
    sheet(head('تسجيل متجر جديد')+`<label for="ln">اسم المتجر</label><input id="ln"><label for="lp">رقم الهاتف</label><input id="lp" type="tel"><button class="buy" data-a="register">تسجيل المتجر</button>`);return;
  }
  sheet(head(m==='r'?'حساب جديد':'دخول')+(m==='r'?'<label for="ln">الاسم</label><input id="ln">':'')+
  `<label for="lp">البريد الإلكتروني</label><input id="lp" type="email" autocomplete="email"><label for="lk">كلمة المرور (6 أحرف على الأقل)</label><input id="lk" type="password" autocomplete="${m==='r'?'new-password':'current-password'}"><button class="buy" data-a="dologin" data-v="${m}">${m==='r'?'إنشاء الحساب':'دخول'}</button>`);
}
function fsheet(id){
  const p=id?prod(id):null;cur={img:p?p.img:'',id};
  sheet(head(p?'تعديل المنتج':'إضافة منتج')+`<label for="fn">اسم المنتج</label><input id="fn" value="${esc(p?p.name:'')}">
  <label for="fpr">السعر (د.ع)</label><input id="fpr" type="number" inputmode="numeric" min="0" value="${p?p.price:''}">
  <label for="fs">الكمية المتوفرة</label><input id="fs" type="number" inputmode="numeric" min="0" value="${p?p.stock:''}">
  <label for="fc">التصنيف</label><select id="fc">${CATS.map(c=>`<option ${p&&p.cat===c?'selected':''}>${c}</option>`).join('')}</select>
  <label for="fd">الوصف</label><textarea id="fd" rows="2">${esc(p?p.desc:'')}</textarea>
  <label for="pimg">صورة المنتج</label><input id="pimg" type="file" accept="image/*"><div class="tile big" id="pv" style="max-width:120px">${p?thumb(p):'📷'}</div>
  <button class="buy" data-a="psave">حفظ المنتج</button>`);
}
function filterSheet(){
  sheet(head('فلتر')+`<div class="filter-group"><h3>القسم</h3><div class="filter-chips">${['all',...CATS].map(c=>`<button data-a="fcat" data-v="${c}" aria-pressed="${cat===c}">${c==='all'?'الكل':c}</button>`).join('')}</div></div>
  <div class="filter-group"><h3>الموقع</h3><p class="note">تصفية المحافظة ستتوفر حين تصبح مواقع المنتجات محفوظة في التطبيق.</p></div>
  <div class="filter-group"><h3>السعر (د.ع)</h3><div class="filter-range"><label>من<input id="fmin" type="number" inputmode="numeric" min="0" placeholder="0" value="${esc(filt.min)}"></label><label>إلى<input id="fmax" type="number" inputmode="numeric" min="0" placeholder="بدون حد" value="${esc(filt.max)}"></label></div></div>
  <div class="filter-group"><h3>الحالة</h3><p class="note">فلتر جديد أو مستعمل سيُفعّل بعد إضافة حالة المنتج إلى بيانات الإعلان.</p></div>
  <div class="filter-group"><h3>الترتيب</h3><div class="filter-chips">${[['newest','الأحدث'],['oldest','الأقدم'],['cheap','السعر: الأقل أولًا'],['expensive','السعر: الأعلى أولًا']].map(([v,t])=>`<button data-a="fsort" data-v="${v}" aria-pressed="${filt.sort===v}">${t}</button>`).join('')}</div></div><div class="filter-actions"><button class="buy" data-a="fapply">عرض النتائج</button><button class="alt" data-a="fclear">حذف الفلاتر</button></div>`);
}
function infoSheet(){
  const seller=[['من يستطيع البيع؟','يمكن لصاحب متجر عرض منتجاته، ويمكن لأي شخص عرض ما يملكه للبيع بعد تسجيله كبائع، حتى لو لم يكن لديه محل.'],['كيف أنشر منتجًا؟','أنشئ حسابًا، ثم سجّل كبائع. بعد قبول التسجيل، أضف اسم المنتج وصورته ووصفه وسعره والكمية المتوفرة.'],['هل توجد نسبة من البيع؟','أي رسوم أو نسبة مستقبلية ستُوضح للبائع قبل تطبيقها. لا يخصم التطبيق مالًا تلقائيًا من البيع النقدي.']];
  const buyer=[['كيف أجد منتجًا؟','تصفح الأقسام أو اكتب اسم المنتج في البحث، واستعمل خيارات السعر والترتيب للوصول إلى ما يناسبك.'],['كيف أشتري؟','افتح المنتج، أضفه إلى السلة ثم أرسل الطلب. يمكنك متابعة حالته من حسابي ← طلباتي. الدفع عند الاستلام بحسب الاتفاق مع البائع.'],['هل أستطيع البيع أيضًا؟','نعم. سجّل كبائع واعرض المنتج الذي تملكه حتى لو لم يكن لديك متجر.']];
  const rows=infoRole==='seller'?seller:buyer;
  sheet(head('عن سوق الشطرة')+`<p class="note">سوق محلي يعرض منتجات المتاجر والأفراد في الشطرة.</p><div class="info-tabs"><button data-a="inforole" data-v="seller" aria-pressed="${infoRole==='seller'}">للبائع</button><button data-a="inforole" data-v="buyer" aria-pressed="${infoRole==='buyer'}">للمشتري</button></div><div class="faq">${rows.map(([title,body])=>`<details><summary>${title}</summary><p>${body}</p></details>`).join('')}</div>`);
}

/* ===== الإجراءات ===== */
const A={
  tab:v=>{tab=v;render();scrollTo(0,0)},
  cat:v=>{cat=v;market()},
  allcat:()=>{cat='all';market()},
  searchfocus:()=>{tab='market';render();$('#q').focus()},
  filters:filterSheet,
  fcat:v=>{cat=v;filterSheet()},
  fsort:v=>{filt.sort=v;filterSheet()},
  fapply:()=>{const min=val('fmin'),max=val('fmax');if((min&&+min<0)||(max&&+max<0)||(min&&max&&+min>+max)){toast('تحقق من حدود السعر');return}filt.min=min;filt.max=max;A.close();market()},
  fclear:()=>{cat='all';filt.min='';filt.max='';filt.sort='newest';A.close();market()},
  info:infoSheet,
  inforole:v=>{infoRole=v;infoSheet()},
  notifications:()=>sheet(head('الإشعارات')+'<div class="empty">لا توجد إشعارات حاليًا.</div>'),
  addentry:()=>{if(!user){tab='account';render();lsheet('m');return}if(!ownStore){lsheet('store');return}fsheet('')},
  close:()=>{$('#shade').hidden=true},
  prod:v=>{cur={p:prod(v),n:1};psheet()},
  pq:v=>{cur.n=Math.min(cur.p.stock||1,Math.max(1,cur.n+ +v));psheet()},
  add:()=>{const {p,n}=cur,c=D.cart.find(x=>x.pid===p.id);if(c)c.q=Math.min(p.stock,c.q+n);else D.cart.push({pid:p.id,q:n});save();A.close();render();toast('أُضيف للسلة')},
  cart:()=>csheet(),
  cq:v=>{const [id,d]=v.split('|'),c=D.cart.find(x=>x.pid===id),p=prod(id);c.q=Math.min(p.stock,c.q+ +d);if(c.q<1)D.cart=D.cart.filter(x=>x!==c);save();render();csheet()},
  order:()=>act(async()=>{
    if(!user){A.close();tab='account';render();lsheet('m');toast('سجّل الدخول لإرسال الطلب');return}
    const name=val('cn'),phone=val('cp').replace(/\D/g,''),addr=val('ca'),note=val('cno');
    if(name.length<2||addr.length<3||!/^\d{10,11}$/.test(phone)){toast('اكتب الاسم ورقم هاتف صحيح والعنوان');return}
    const groups=new Map();for(const c of D.cart){const p=prod(c.pid);if(!p)continue;if(!groups.has(p.mid))groups.set(p.mid,[]);groups.get(p.mid).push({id:p.id,quantity:c.q})}
    const ids=[];for(const [store,lines] of groups){
      const id=check(await db.rpc('place_order',{p_store:store,p_lines:lines,p_name:name,p_phone:phone,p_address:addr,p_note:note}));
      ids.push('#'+id.slice(-4).toUpperCase());D.cart=D.cart.filter(c=>!lines.some(l=>l.id===c.pid));save();
    }
    D.cust={name,phone,addr};save();await refresh();
    sheet(`<div class="done"><div class="ck" aria-hidden="true">✓</div><h2>وصل طلبك</h2><p class="note">رقم الطلب ${ids.join('، ')}<br>سيتصل بك التاجر للتأكيد. الدفع عند الاستلام.</p><button class="buy" data-a="close">تم</button></div>`);
  }),
  login:v=>lsheet(v),
  dologin:m=>act(async()=>{
    const email=val('lp'),password=val('lk');if(!email.includes('@')||password.length<6){toast('اكتب البريد وكلمة مرور من 6 أحرف على الأقل');return}
    const button=$('#sheet [data-a="dologin"]');
    if(button.disabled)return;
    button.disabled=true;button.textContent='جارٍ الاتصال…';
    try{
      if(m==='r'){
        const name=val('ln');if(name.length<2){toast('اكتب اسمك');return}
        const data=check(await db.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:location.origin+location.pathname}}));
        if(!data.session){A.close();toast('تحقق من بريدك الإلكتروني، ثم سجّل الدخول');return}
      }else check(await db.auth.signInWithPassword({email,password}));
      await refresh();dt=ownStore?'p':'m';A.close();render();toast('تم الدخول');
    }finally{
      if(button.isConnected){button.disabled=false;button.textContent=m==='r'?'إنشاء الحساب':'دخول'}
    }
  }),
  register:()=>act(async()=>{
    if(!user)return;
    const name=val('ln'),phone=val('lp').replace(/\D/g,'');if(name.length<2||phone.length<10){toast('اكتب اسم المتجر ورقم الهاتف');return}
    check(await db.rpc('register_store',{p_name:name,p_phone:phone,p_address:'',p_description:'',p_social_url:''}));
    await refresh();dt='p';A.close();render();toast('تم تسجيل المتجر. ينتظر موافقة الإدارة');
  }),
  out:()=>act(async()=>{check(await db.auth.signOut());await refresh();dt='p';render()}),
  dtab:v=>{dt=v;render()},
  pform:v=>fsheet(v),
  psave:()=>act(async()=>{
    if(!ownStore){toast('سجّل متجرًا أولًا');return}
    const name=val('fn'),price=+val('fpr'),stock=+val('fs');
    if(name.length<2||!(price>0)||!(stock>=0)||val('fs')===''){toast('اكتب الاسم والسعر والكمية');return}
    let image_path=cur.id?prod(cur.id)?.image_path:null;
    if(cur.img&&cur.img.startsWith('data:image/')){
      const blob=await (await fetch(cur.img)).blob();if(blob.size>2097152)throw Error('الصورة كبيرة؛ اختر صورة أصغر');
      image_path=`${ownStore.id}/${uid()}.jpg`;
      check(await db.storage.from('products').upload(image_path,blob,{contentType:'image/jpeg'}));
    }
    const f={name,price,stock,category:$('#fc').value,description:val('fd'),image_path,store_id:ownStore.id};
    if(cur.id)check(await db.from('products').update(f).eq('id',cur.id));else check(await db.from('products').insert(f));
    await refresh();A.close();render();toast('تم حفظ المنتج');
  }),
  pdel:v=>ask('حذف هذا المنتج؟','pdel2',v),
  pdel2:v=>act(async()=>{check(await db.from('products').delete().eq('id',v));await refresh();A.close();render()}),
  st:v=>act(async()=>{const o=D.o.find(x=>x.id===v);if(!o)return;check(await db.rpc('set_order_status',{p_order:v,p_status:STCODE[Math.min(3,o.st+1)]}));await refresh()}),
  cancel:v=>ask('إلغاء هذا الطلب؟','cancel2',v),
  cancel2:v=>act(async()=>{check(await db.rpc('set_order_status',{p_order:v,p_status:'cancelled'}));await refresh();A.close();render()}),
  mok:v=>act(async()=>{const m=mrec(v);check(await db.rpc('approve_store',{p_store:v,p_approved:!m.ok}));await refresh()}),
  comm:()=>{toast('إعداد العمولة يحتاج تفعيلًا في قاعدة البيانات')}

};
document.addEventListener('click',e=>{
  if(e.target.id==='shade'){A.close();return}
  const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v);
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='pimg'||!e.target.files[0])return;
  const im=new Image();im.onload=()=>{const s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cur.img=c.toDataURL('image/jpeg',.72);$('#pv').innerHTML=`<img src="${cur.img}" alt="">`};
  im.src=URL.createObjectURL(e.target.files[0]);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')A.close()});
$('#q').addEventListener('input',e=>{q=e.target.value;market()});
refresh().catch(error);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>

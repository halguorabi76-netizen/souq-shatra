<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6}

.top{background:var(--navy);color:#fff;padding:16px 16px 42px;border-radius:0 0 28px 28px;display:flex;align-items:center;justify-content:space-between}

.search{margin:-24px 16px 0}

.chips{display:flex;gap:8px;overflow-x:auto;padding:16px;scrollbar-width:none}

.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:start;display:flex;flex-direction:column;gap:2px}

.empty{padding:40px 24px;text-align:center;color:var(--mut)}

.buy{background:var(--gold);color:var(--gi)}
.buy:disabled{opacity:.5}
.alt{border:1.5px solid var(--line)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0}
.link{color:var(--bad)}
.item{display:flex;gap:12px;align-items:center;margin:10px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.item .tile{width:56px;flex:none;font-size:26px;margin:0}
.item>div:nth-child(2){flex:1;min-width:0}
.item small,.ord small{color:var(--mut);display:block}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button{border:1.5px solid var(--line);border-radius:10px;padding:5px 12px;font-size:14px}
.acts .go{background:var(--ok);border-color:var(--ok);color:#fff}
.ord{margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ord .r{display:flex;justify-content:space-between;gap:8px}
.pill{display:inline-block;font-size:13px;padding:1px 10px;border-radius:999px;background:var(--tile)}
.s0{background:color-mix(in srgb,var(--gold) 30%,transparent)}.s3{background:color-mix(in srgb,var(--ok) 25%,transparent)}.s4{background:color-mix(in srgb,var(--bad) 22%,transparent)}
.tabs{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{padding:12px;color:var(--mut);font-size:15px}

.shade[hidden]{display:none}

@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh{display:flex;align-items:center;justify-content:space-between}
.x{font-size:22px;color:var(--mut);padding:4px 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line);font-size:19px}
.big{max-width:240px;margin:10px auto}
.note{color:var(--mut);font-size:13px;margin:8px 0 0}.bad{color:var(--bad)}
.done{text-align:center}.ck{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;display:grid;place-items:center;margin:8px auto}
#toast{position:fixed;inset-inline:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:9;text-align:center}
#toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.tabs{grid-template-columns:repeat(5,minmax(0,1fr))}.tabs button{font-size:11px;min-width:0;padding-inline:2px}.tabs .navicon{font-size:23px}.welcome-roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.welcome-roles .welcome-option{display:block;text-align:center;padding:12px 4px}.welcome-roles .symbol{display:block;width:auto;font-size:25px}.welcome-roles strong{font-size:13px}.welcome-guest{background:none;color:var(--mut);text-decoration:underline;padding:12px}.role-badge{margin:14px 16px;padding:14px;border-radius:18px;background:#e9dbf5;color:#4e206e;font-weight:700}.setting-row{width:100%;display:block;text-align:right;background:#fff;padding:15px;border-bottom:1px solid var(--line);color:var(--ink)}.avatar{width:42px;height:42px;border-radius:50%;background:#e5d1f3;color:#4a1d6c;display:inline-grid;place-items:center;font-size:27px;vertical-align:middle;margin-inline-end:8px}

@media(max-height:700px){.welcome-mode .top{padding-top:2px}.welcome-mode .header-logo{height:88px}.welcome-content{margin-top:12px}.welcome h1{font-size:22px}.welcome p{font-size:13px}.welcome-roles{margin-top:18px}.welcome-roles .symbol{width:68px;height:68px}.welcome-roles .symbol svg{width:49px;height:49px}.welcome-roles strong{font-size:13px}.welcome-guest{bottom:calc(5px + env(safe-area-inset-bottom,0px))}}

<style>

<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.0";
import {SUPABASE_URL,SUPABASE_ANON_KEY} from "./config.js";
async function apiFetch(resource,init={}){
  const controller=new AbortController(),source=init.signal||resource?.signal;
  const abort=()=>controller.abort();
  if(source?.aborted)abort();else source?.addEventListener('abort',abort,{once:true});
  const timer=setTimeout(abort,20000);
  try{return await fetch(resource,{...init,signal:controller.signal})}
  finally{clearTimeout(timer);source?.removeEventListener('abort',abort)}
}
const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true},global:{fetch:apiFetch}});
/* طبقة التخزين: حالياً في متصفح الجهاز. عند الانتقال لتطبيق حقيقي تُستبدل بقاعدة بيانات (Firebase / Supabase). */
const KEY='souq-shatra-online';
const local=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')||{}}catch{return {}}})();
let D={m:[],p:[],o:[],people:[],cart:Array.isArray(local.cart)?local.cart:[],me:null,comm:10,opin:'',cust:local.cust||{name:'',phone:'',addr:''}};
let user=null,profile=null,ownStore=null,refreshId=0,dataReady=false;
let driverAccount=null,deliverySettings={platform_fee:0,delivery_fee:0,qi_number:''},deliveryOffers=[],deliveryPayments=[];
let viewMode='guest',geoPoint=null;
const rememberMode=mode=>{viewMode=mode;try{if(user&&mode!=='guest')localStorage.setItem('souq-shatra-mode-'+user.id,mode);else if(!user&&mode!=='guest')sessionStorage.setItem('souq-shatra-pending-role',mode)}catch{}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({cart:D.cart,cust:D.cust}))}catch{toast('تعذّر حفظ السلة على هذا الجهاز')}};
const check=r=>{if(r.error)throw r.error;return r.data};
function withTimeout(promise,ms=12000){
  let timer;
  return Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Object.assign(new Error('انتهت مهلة الاتصال. تحقق من الإنترنت وأعد المحاولة.'),{name:'TimeoutError'})),ms)})]).finally(()=>clearTimeout(timer));
}
function error(e){toast(e?.name==='AbortError'||e?.name==='TimeoutError'?'انتهت مهلة الاتصال. تحقق من الإنترنت وأعد المحاولة.':'تعذّر إكمال العملية: '+(e?.message||e))}
const STCODE=['new','accepted','delivery','delivered','cancelled'];
const fromOrder=o=>({id:o.id,mid:o.store_id,items:(o.order_items||[]).map(i=>({pid:i.product_id,name:i.product_name,price:i.price,q:i.quantity})),total:o.total,st:Math.max(0,STCODE.indexOf(o.status)),ts:o.created_at,cust:{name:o.customer_name,phone:o.customer_phone,addr:o.address,note:o.note}});
async function refresh(){
  const id=++refreshId;
  // Keep the storefront visible while session and product requests finish.
  try{
  const session=check(await withTimeout(db.auth.getSession()));
  const nextUser=session.session?.user||null;
  if(id!==refreshId)return;
  // Restore the saved identity before querying the marketplace. A slow or failed
  // product/delivery request must never send a signed-in person back to welcome.
  if(user?.id!==nextUser?.id){profile=null;ownStore=null;viewMode=''}
  user=nextUser;
  if(user){
    if(!viewMode){
      try{viewMode=localStorage.getItem('souq-shatra-mode-'+user.id)||sessionStorage.getItem('souq-shatra-pending-role')||''}catch{}
      if(viewMode==='guest')viewMode='';
    }
    if(tab==='welcome'){
      tab=viewMode==='seller'||viewMode==='driver'?'account':'market';
      render();
    }
  }else if(viewMode!=='guest'){
    profile=null;ownStore=null;
    // Every device opens the storefront. Guests choose a role from the account menu.
    viewMode='guest';
    tab='market';
    render();
  }
  const [pr,ms,ps,rs]=await withTimeout(Promise.all([
    nextUser?db.from('profiles').select('*').eq('id',nextUser.id).single():Promise.resolve({data:null,error:null}),
    db.from('stores').select('*'),
    db.from('products').select('*').order('created_at',{ascending:false}),
    nextUser?db.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}):Promise.resolve({data:[],error:null})
  ]));
  const nextProfile=check(pr),stores=check(ms),products=check(ps),orders=check(rs);
  const people=nextProfile?.role==='admin'?check(await withTimeout(db.from('profiles').select('id,full_name,phone,role,disabled,created_at').order('created_at',{ascending:false}))):[];
  const dl=await withTimeout(Promise.all([
    db.from('delivery_settings').select('*').limit(1).maybeSingle(),
    nextUser?db.from('delivery_workers').select('*').eq('user_id',nextUser.id).maybeSingle():Promise.resolve({data:null}),
    nextUser?db.from('delivery_payments').select('*').order('created_at',{ascending:false}):Promise.resolve({data:[]}),
    nextProfile?.role==='admin'?db.from('delivery_workers').select('*').order('created_at',{ascending:false}):Promise.resolve({data:[]})
  ]));
  // An older deployment can load the rest of the market before the migration is installed.
  deliverySettings=dl[0].data||{platform_fee:0,delivery_fee:0,qi_number:''};
  driverAccount=dl[1].data||null;deliveryPayments=dl[2].data||[];D.drivers=dl[3].data||[];
  if(nextUser&&driverAccount?.approved&&driverAccount.amount_due<driverAccount.debt_limit){
    const offers=await withTimeout(db.rpc('available_delivery_orders'));deliveryOffers=offers.data||[];
  }else deliveryOffers=[];
  if(id!==refreshId)return;
  profile=nextProfile;
  D.m=stores.map(m=>({id:m.id,name:m.name,phone:m.phone,address:m.address,ok:m.approved,removed:m.removed,owner_id:m.owner_id,created_at:m.created_at}));
  D.p=products.map(p=>({id:p.id,mid:p.store_id,name:p.name,desc:p.description,cat:p.category,price:p.price,stock:p.stock,img:p.image_path?db.storage.from('products').getPublicUrl(p.image_path).data.publicUrl:'',image_path:p.image_path,active:p.active,blocked:p.blocked}));
  ownStore=user?D.m.find(m=>m.owner_id===user.id):null;
  if(user&&!viewMode)viewMode=ownStore?'seller':nextProfile?.role==='driver'?'driver':'buyer';
  if(user&&viewMode!=='guest'){rememberMode(viewMode);try{sessionStorage.removeItem('souq-shatra-pending-role')}catch{}}
  if(user&&viewMode&&tab==='welcome')tab=viewMode==='seller'||viewMode==='driver'?'account':'market';
  if(!user&&viewMode===''){viewMode='guest';tab='market'}
  D.me=profile?.role==='admin'?'owner':ownStore?.id||null;
  D.o=orders.map(o=>({...fromOrder(o),buyer_id:o.buyer_id,driver_id:o.driver_id,platform_fee:o.platform_fee||0,delivery_fee:o.delivery_fee||0}));
  D.people=people;
  dataReady=true;
  D.cart=D.cart.filter(x=>D.p.some(p=>p.id===x.pid));save();render();
  }finally{if(id===refreshId)$('#loading').hidden=true}
}

let tab='market',cat='all',q='',dt='p',cur=null,infoRole='seller',adminTab='overview',bannerIndex=0;
const BANNERS=[['icons/shatra-river.jpeg','اكتشفوا سحر الشطرة'],['icons/shatra-square.jpeg','اكتشفوا أسواق الشطرة'],['icons/shatra-bridge.jpeg','الشطرة تجمعنا']];

  closeAccountMenu();
  const n=D.cart.reduce((s,c)=>s+c.q,0);

  document.body.classList.toggle('profile-mode',tab==='profilePage');

  const roleNav=$('.tabs [data-v="chats"]');roleNav.innerHTML=viewMode==='driver'?'<span class="navicon">▣</span>التوصيل':'<span class="navicon">▣</span>الطلبات';

  $('#view').innerHTML=`<div class="welcome"><div class="welcome-content"><h1>أهلًا بك في سوق الشطرة</h1><p>اختر دورك مرة واحدة، ويمكنك شراء المنتجات من أي حساب</p><div class="welcome-roles"><button class="welcome-option" data-a="enter" data-v="buyer" aria-label="الدخول كزبون"><span class="symbol"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="15" r="7" fill="#F0C3A5"/><path d="M26 12q6-9 13 0v4H26Z" fill="#3A3144"/><path d="M23 26q8-8 18 0l4 17H19Z" fill="#A78EB4"/><path d="M20 29l-5 11m29-11 5 11"/><path d="M9 38h46l-6 16H15Z" fill="#9A70B6"/><path d="M17 38l4 16m8-16 1 16m8-16-1 16m10-16-4 16M14 47h36" stroke="#3C2D48"/><path d="M24 35l4 5m12-5-4 5"/></svg></span><strong>زبون</strong></button><button class="welcome-option" data-a="enter" data-v="seller" aria-label="الدخول كبائع"><span class="symbol"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="35" width="48" height="19" rx="2" fill="#74578E"/><rect x="12" y="39" width="40" height="9" rx="1" fill="#D8C5E7"/><rect x="18" y="27" width="26" height="8" rx="1" fill="#8BB8A4"/><rect x="21" y="15" width="23" height="14" rx="2" fill="#D8C7E5"/><rect x="25" y="18" width="15" height="8" fill="#A4CFB8"/><path d="M26 33h12m-30 2h48M21 44h8m6 0h8M9 55h46"/><rect x="8" y="16" width="10" height="15" rx="1" fill="#F2DAB4"/><path d="M11 20h4m-4 4h4"/></svg></span><strong>بائع</strong></button><button class="welcome-option" data-a="enter" data-v="driver" aria-label="الدخول كعامل توصيل"><span class="symbol"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="17" cy="49" r="8" fill="#E9E5EF"/><circle cx="49" cy="49" r="8" fill="#E9E5EF"/><circle cx="17" cy="49" r="3" fill="#6D5686"/><circle cx="49" cy="49" r="3" fill="#6D5686"/><path d="M17 49l9-17h17l6 17H17Zm9-17 11 17m-1-17 7 17M12 32h15" fill="#B9A0C8"/><rect x="6" y="24" width="16" height="14" rx="2" fill="#D99A5E"/><path d="M6 29h16m-8-5v14"/><circle cx="38" cy="17" r="6" fill="#EFC4A9"/><path d="M31 15q1-9 11-6l2 7Z" fill="#403345"/><path d=" async function loadAuthProviders(){
  const target=$('#authProviders');if(!target)return;
  const providers=[['google','Google','G']];
  function paint(){
    if(!target.isConnected)return;
    target.innerHTML=providers.map(([provider,name,icon])=>`<button type="button" class="auth-provider ${provider}" data-a="oauth" data-v="${provider}"><span aria-hidden="true">${icon}</span>المتابعة باستخدام ${name}</button>`).join('')+'<div class="auth-divider">أو بالبريد الإلكتروني</div>';
    target.hidden=false;
  }
  paint();
  try{
    const settings=await authProviderSettings();
    for(const item of [['facebook','Facebook','f'],['apple','Apple','●']])if(settings.external?.[item[0]])providers.push(item);
    paint();
  }catch{}
}

      if(m==='r'){

        const data=check(await withTimeout(db.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:location.origin+location.pathname}})));
        if(!data.session){A.close();toast('تحقق من بريدك الإلكتروني، ثم سجّل الدخول');return}
        signedIn=data.user;
      }else signedIn=check(await withTimeout(db.auth.signInWithPassword({email,password}))).user;
      user=signedIn;rememberMode(['seller','driver'].includes(viewMode)?viewMode:'buyer');profile=null;ownStore=null;dt='m';tab=['seller','driver'].includes(viewMode)?'account':'market';A.close();render();toast('تم الدخول');
      refresh().catch(error);
    }finally{
      if(button.isConnected){button.disabled=false;button.textContent=m==='r'?'إنشاء الحساب':'دخول'}
    }
  }),
  register:()=>act(async()=>{
    if(!user)return;
    const name=val('ln'),phone=val('lp').replace(/\D/g,''),address=val('la');if(name.length<2||phone.length<10||address.length<3){toast('اكتب اسم البائع ورقم الهاتف وعنوان الاستلام');return}
    check(await db.rpc('register_store',{p_name:name,p_phone:phone,p_address:address,p_description:'',p_social_url:''}));
    await refresh();dt='p';A.close();render();toast('تم تسجيل المتجر. ينتظر موافقة الإدارة');
  }),
  out:()=>act(async()=>{check(await db.auth.signOut());user=null;profile=null;ownStore=null;viewMode='guest';tab='market';dt='p';render();refresh().catch(error)}),
  dtab:v=>{dt=v;render()},
  pform:v=>{if(viewMode!=='seller'&&profile?.role!=='admin'){toast('انتقل إلى وضع البائع من حسابي أولًا');return}fsheet(v)},
  psave:()=>act(async()=>{
    if(!ownStore){toast('سجّل متجرًا أولًا');return}
    const name=val('fn'),price=+val('fpr'),stock=+val('fs');
    if(name.length<2||!(price>0)||!(stock>=0)||val('fs')===''){toast('اكتب الاسم والسعر والكمية');return}
    let image_path=cur.id?prod(cur.id)?.image_path:null;
    if(cur.img&&cur.img.startsWith('data:image/')){
      const blob=await (await fetch(cur.img)).blob();if(blob.size>2097152)throw Error('الصورة كبيرة؛ اختر صورة أصغر');
      image_path=`${ownStore.id}/${uid()}.jpg`;
      check(await db.storage.from('products').upload(image_path,blob,{contentType:'image/jpeg'}));
    }
    const f={name,price,stock,category:$('#fc').value,description:val('fd'),image_path,store_id:ownStore.id};
    if(cur.id)check(await db.from('products').update(f).eq('id',cur.id));else check(await db.from('products').insert(f));
    tab='listings';await refresh();A.close();render();toast('تم حفظ المنتج');
  }),
  pdel:v=>ask('حذف هذا المنتج؟','pdel2',v),
  pdel2:v=>act(async()=>{check(await db.from('products').delete().eq('id',v));await refresh();A.close();render()}),
  st:v=>act(async()=>{const o=D.o.find(x=>x.id===v);if(!o)return;check(await db.rpc('set_order_status',{p_order:v,p_status:STCODE[Math.min(3,o.st+1)]}));await refresh()}),
  cancel:v=>ask('إلغاء هذا الطلب؟','cancel2',v),
  cancel2:v=>act(async()=>{check(await db.rpc('set_order_status',{p_order:v,p_status:'cancelled'}));await refresh();A.close();render()}),
  mok:v=>act(async()=>{const m=mrec(v);check(await db.rpc('approve_store',{p_store:v,p_approved:!m.ok}));await refresh()}),
  userDisableAsk:v=>{if(profile?.role!=='admin')return;const p=D.people.find(x=>x.id===v);if(!p||p.role==='admin')return;ask(p.disabled?'إعادة تفعيل هذا الحساب؟':'تعطيل هذا الحساب ومنعه من الطلب أو البيع؟ ستبقى الطلبات السابقة محفوظة.','userDisable2',v)},
  userDisable2:v=>act(async()=>{if(profile?.role!=='admin')return;const p=D.people.find(x=>x.id===v);if(!p)return;check(await db.rpc('admin_set_account_disabled',{p_user:v,p_disabled:!p.disabled}));A.close();await refresh();toast('تم تحديث الحساب')}),
  storeRemoveAsk:v=>{if(profile?.role!=='admin')return;const m=mrec(v);if(!m.id)return;ask(m.removed?'إعادة هذا البائع إلى قائمة المراجعة؟ ستحتاج إلى قبوله من جديد.':'إزالة هذا البائع ومنتجاته من السوق؟ تبقى الطلبات السابقة محفوظة.','storeRemove2',v)},
  storeRemove2:v=>act(async()=>{if(profile?.role!=='admin')return;const m=mrec(v);check(await db.rpc('admin_set_store_removed',{p_store:v,p_removed:!m.removed}));A.close();await refresh();toast('تم تحديث البائع')}),
  productBlockAsk:v=>{if(profile?.role!=='admin')return;const p=prod(v);if(!p)return;ask(p.blocked?'إعادة هذا المنتج للظهور إذا كان متجره معتمدًا؟':'إزالة هذا المنتج من السوق؟ ستبقى تفاصيل الطلبات السابقة محفوظة.','productBlock2',v)},
  productBlock2:v=>act(async()=>{if(profile?.role!=='admin')return;const p=prod(v);check(await db.rpc('admin_set_product_blocked',{p_product:v,p_blocked:!p.blocked}));A.close();await refresh();toast('تم تحديث المنتج')}),
  adminAcceptAsk:v=>{if(profile?.role==='admin')ask('تحديث حالة هذا الطلب إلى مقبول؟','adminAccept2',v)},
  adminAccept2:v=>act(async()=>{if(profile?.role!=='admin')return;check(await db.rpc('set_order_status',{p_order:v,p_status:'accepted'}));A.close();await refresh();toast('تم قبول الطلب')}),
  adminCancelAsk:v=>{if(profile?.role==='admin')ask('إلغاء هذا الطلب وإعادة الكمية إلى المخزون؟','adminCancel2',v)},
  adminCancel2:v=>act(async()=>{if(profile?.role!=='admin')return;check(await db.rpc('set_order_status',{p_order:v,p_status:'cancelled'}));A.close();await refresh();toast('تم إلغاء الطلب')}),
  comm:()=>{toast('إعداد العمولة يحتاج تفعيلًا في قاعدة البيانات')}

};
document.addEventListener('click',e=>{
  if(e.target.id==='shade'){A.close();return}
  if(!e.target.closest('#accountMenu')&&!e.target.closest('#accountTrigger'))closeAccountMenu();
  const t=e.target.closest('[data-a]');if(t?.matches('#authForm [type="submit"]'))return;if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v);
});
document.addEventListener('change',async e=>{
  if(e.target.id==='avatarInput'&&e.target.files[0]){
    if(!user)return;const id=user.id,file=e.target.files[0];if(!file.type.startsWith('image/')){toast('اختر صورة فقط');return}
    const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);if(user?.id!==id)return;const scale=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{localStorage.setItem('souq-shatra-avatar-'+id,c.toDataURL('image/jpeg',.72));render();toast('تم حفظ صورتك على هذا الجهاز')}catch{toast('تعذّر حفظ الصورة. اختر صورة أصغر')}};im.onerror=()=>{URL.revokeObjectURL(url);toast('تعذّر قراءة الصورة')};im.src=url;return
  }
  if(e.target.id!=='pimg'||!e.target.files[0])return;
  const im=new Image();im.onload=()=>{const s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cur.img=c.toDataURL('image/jpeg',.72);$('#pv').innerHTML=`<img src="${cur.img}" alt="">`;updatePostProgress()};
  im.src=URL.createObjectURL(e.target.files[0]);
});
document.addEventListener('input',e=>{if(['fn','fpr','fs','fd'].includes(e.target.id))updatePostProgress()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAccountMenu();A.close()}});
document.addEventListener('submit',e=>{if(e.target.id==='authForm'){e.preventDefault();A.dologin(e.target.dataset.mode)}});
function updateBanner(){const banner=$('.banner');if(!banner)return;banner.querySelector('img').src=BANNERS[bannerIndex][0];banner.querySelector('.banner-caption').textContent=BANNERS[bannerIndex][1];document.querySelectorAll('.banner-dots button').forEach((b,i)=>b.setAttribute('aria-current',String(i===bannerIndex)))}
let bannerTouch=null,lastBannerInteraction=0;
$('#view').addEventListener('touchstart',e=>{
  bannerTouch=e.touches.length===1&&e.target.closest('.banner')?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;
},{passive:true});
$('#view').addEventListener('touchend',e=>{
  if(!bannerTouch||e.changedTouches.length!==1)return;
  const dx=e.changedTouches[0].clientX-bannerTouch.x,dy=e.changedTouches[0].clientY-bannerTouch.y;
  bannerTouch=null;
  if(Math.abs(dx)<40||Math.abs(dx)<Math.abs(dy)*1.2)return;
  bannerIndex=(bannerIndex+(dx<0?1:-1)+BANNERS.length)%BANNERS.length;
  lastBannerInteraction=Date.now();updateBanner();
},{passive:true});
$('#view').addEventListener('touchcancel',()=>{bannerTouch=null},{passive:true});
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{if(tab==='market'&&!document.hidden&&Date.now()-lastBannerInteraction>5500){bannerIndex=(bannerIndex+1)%BANNERS.length;updateBanner()}},5500);
db.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY')setTimeout(recoverySheet,0)});
window.SouqDemo?.init(render);
render();
refresh().catch(e=>{
  if(!dataReady&&!window.SouqDemo?.isActive()){
    $('#view').innerHTML='<div class="empty"><h2>تعذّر التحقق من جلسة الدخول</h2><p>تحقق من الاتصال ثم حاول مجددًا.</p><button class="buy" data-a="retry">إعادة المحاولة</button></div>'+(window.SouqDemo?.preview()||'');
  }
  error(e);
});
setInterval(()=>{if(!document.hidden&&user&&dataReady&&((viewMode==='driver'&&tab==='chats')||(profile?.role==='admin'&&tab==='admin'&&adminTab==='drivers')))refresh().catch(()=>{})},60000);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
<script>
// Keep Android users from seeing an empty page when an external module never loads.
setTimeout(() => {
  const view=document.getElementById('view');
  if(view && !view.firstElementChild){
    document.getElementById('loading').hidden=true;
    view.innerHTML='<div class="empty"><h2>تعذّر بدء التطبيق</h2><p>تحقق من اتصال الإنترنت ثم افتح التطبيق مجددًا.</p><button class="buy" onclick="location.reload()">إعادة المحاولة</button></div>'+(window.SouqDemo?.preview()||'');
  }
},15000);
</script>

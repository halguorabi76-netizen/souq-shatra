<title>سوق الشطرة</title>

<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#12202E;--mut:#5F6E7E;--line:#DFE5EC;--navy:#0F2A3F;--gold:#F2B33D;--gi:#3A2A00;--ok:#14866D;--bad:#C0392B;--tile:#E7EDF3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1620;--card:#132433;--ink:#EAF0F6;--mut:#9AABBD;--line:#22384B;--navy:#0A1B29;--ok:#3CC9A5;--bad:#F0776B;--tile:#1B3246}}
:root[data-theme="dark"]{--bg:#0B1620;--card:#132433;--ink:#EAF0F6;--mut:#9AABBD;--line:#22384B;--navy:#0A1B29;--ok:#3CC9A5;--bad:#F0776B;--tile:#1B3246}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--ok)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.top{background:var(--navy);color:#fff;padding:16px 16px 42px;border-radius:0 0 28px 28px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
.ib{position:relative;font-size:22px;padding:6px 10px;background:rgba(255,255,255,.1);border-radius:12px}
#cc{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--gold);color:var(--gi);font:700 12px/1 sans-serif;border-radius:999px;min-width:20px;padding:4px 5px;text-align:center;font-style:normal}
.search{margin:-24px 16px 0}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:4px}
.search input{background:var(--card);padding:13px 16px;margin:0;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
label{display:block;font-size:14px;color:var(--mut);margin-top:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:15px}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:start;display:flex;flex-direction:column;gap:2px}
.tile{width:100%;aspect-ratio:1;border-radius:12px;background:var(--tile);display:grid;place-items:center;font-size:44px;overflow:hidden;margin-bottom:6px}
.tile img{width:100%;height:100%;object-fit:cover}
.p b{font-size:16px}.p span{color:var(--mut);font-size:13px}
.p em{font-style:normal;color:var(--ok);font-weight:700}
.p u{text-decoration:none;color:var(--bad);font-size:13px}
.empty{padding:40px 24px;text-align:center;color:var(--mut)}
.box{margin:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.box h2,.sh h2{margin:0 0 4px;font-size:19px}
.box p{color:var(--mut);margin:0 0 8px}
.buy,.alt{display:block;width:100%;margin-top:10px;font-weight:700;font-size:16px;padding:13px;border-radius:14px}
.buy{background:var(--gold);color:var(--gi)}
.buy:disabled{opacity:.5}
.alt{border:1.5px solid var(--line)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0}
.link{color:var(--bad)}
.item{display:flex;gap:12px;align-items:center;margin:10px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.item .tile{width:56px;flex:none;font-size:26px;margin:0}
.item>div:nth-child(2){flex:1;min-width:0}
.item small,.ord small{color:var(--mut);display:block}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button{border:1.5px solid var(--line);border-radius:10px;padding:5px 12px;font-size:14px}
.acts .go{background:var(--ok);border-color:var(--ok);color:#fff}
.ord{margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ord .r{display:flex;justify-content:space-between;gap:8px}
.pill{display:inline-block;font-size:13px;padding:1px 10px;border-radius:999px;background:var(--tile)}
.s0{background:color-mix(in srgb,var(--gold) 30%,transparent)}.s3{background:color-mix(in srgb,var(--ok) 25%,transparent)}.s4{background:color-mix(in srgb,var(--bad) 22%,transparent)}
.tabs{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{padding:12px;color:var(--mut);font-size:15px}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--gold)}
.shade{position:fixed;inset:0;background:rgba(5,12,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.shade[hidden]{display:none}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh{display:flex;align-items:center;justify-content:space-between}
.x{font-size:22px;color:var(--mut);padding:4px 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line);font-size:19px}
.big{max-width:240px;margin:10px auto}
.note{color:var(--mut);font-size:13px;margin:8px 0 0}.bad{color:var(--bad)}
.done{text-align:center}.ck{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;display:grid;place-items:center;margin:8px auto}
#toast{position:fixed;inset-inline:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:9;text-align:center}
#toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>
<style>

body{background:#F2EEF8}.app{background:var(--bg);padding-bottom:calc(108px + env(safe-area-inset-bottom,0px));box-shadow:0 0 35px #30134112}

.search{margin:12px 16px 0}.searchline{display:flex;gap:8px;align-items:center}.search input{flex:1;min-width:0;border:1px solid var(--line);box-shadow:none;border-radius:16px}.filter-btn{flex:none;width:52px;height:52px;border-radius:16px;background:var(--navy);color:#fff;font-size:24px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 16px 12px}.section-title h2{margin:0;font-size:20px}.section-title button{color:var(--ok);font-weight:700}
.category-cards{display:flex;gap:10px;padding:0 16px 5px;overflow-x:auto;scrollbar-width:none}.category-cards::-webkit-scrollbar{display:none}

.grid{gap:12px}.p{border-radius:18px;box-shadow:0 6px 18px #36174b0c}.tile{border-radius:14px}.p em{color:var(--navy);font-size:17px}.p b{line-height:1.4}
.tabs{grid-template-columns:repeat(5,1fr);border-radius:22px 22px 0 0;box-shadow:0 -7px 28px #30134115;border-top:0;min-height:78px;z-index:3}.tabs button{font-size:11px;padding:9px 2px 7px;line-height:1.3}.tabs .navicon{display:block;font-size:21px;line-height:1.5}.tabs button[aria-current="page"]{color:var(--gold);box-shadow:none}.tabs button[aria-current="page"]::before{content:"";display:block;position:absolute;top:0;width:32px;height:3px;background:var(--gold);border-radius:0 0 8px 8px}.tabs button{position:relative}.tabs .plus{width:54px;height:54px;border-radius:50%;background:var(--gold);color:#fff;font-size:34px;line-height:1;margin:-26px auto 4px;display:grid;place-items:center;border:4px solid var(--card);box-shadow:0 5px 14px #3211513b}.tabs button[aria-current="page"] .plus{background:var(--navy)}
.sheet{border-radius:26px 26px 0 0}.sh{border-bottom:1px solid var(--line);padding-bottom:10px}.sh h2{font-size:21px}.filter-group{margin:20px 0}.filter-group h3{font-size:16px;margin:0 0 10px}.filter-chips{display:flex;gap:8px;flex-wrap:wrap}.filter-chips button{padding:8px 13px;border-radius:999px;background:var(--tile);border:1px solid var(--line)}.filter-chips button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}.filter-range{display:flex;gap:10px}.filter-range label{flex:1;min-width:0}.filter-actions{display:flex;gap:10px;position:sticky;bottom:-18px;background:var(--card);padding:12px 0}.filter-actions button{margin:0}.faq details{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}.faq summary{cursor:pointer;font-weight:700}.faq p{color:var(--mut);margin:8px 0 0}.info-tabs{display:flex;gap:8px;margin:14px 0}.info-tabs button{flex:1;padding:10px;border-radius:12px;background:var(--tile)}.info-tabs button[aria-pressed="true"]{background:var(--gold);color:white}
.account-head{background:linear-gradient(125deg,#4A1D6C,#73409A);color:#fff;margin:16px;border-radius:20px;padding:20px}.account-head small{display:block;opacity:.8}.account-shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px}.account-shortcuts button{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:16px;text-align:center}.loading-buddy{width:80px;height:80px;margin:0 auto 12px;background:#E8D8F3;border-radius:27px;display:grid;place-items:center;position:relative;animation:bob 1.6s ease-in-out infinite}.loading-buddy:before{content:"";width:46px;height:37px;background:#64338A;border-radius:12px 12px 18px 18px;position:absolute;top:18px}.loading-buddy:after{content:"•  •";color:#fff;font-size:23px;letter-spacing:3px;position:absolute;top:15px}.loading-buddy span{position:absolute;bottom:10px;font-size:13px;color:#64338A}.loading-buddy.still{animation:none}@keyframes bob{50%{transform:translateY(-6px)}}
.loading-overlay{position:fixed;inset:0;background:#f8f6fcdd;z-index:8;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--navy)}.loading-overlay[hidden]{display:none}
.admin-hero{margin:16px;background:linear-gradient(125deg,#2E0D4B,#6D348F);color:#fff;border-radius:20px;padding:19px}.admin-hero b{font-size:21px}.admin-hero small{display:block;opacity:.85}.admin-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px}.admin-stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.admin-stat strong{display:block;font-size:22px;color:var(--navy)}.admin-stat small{color:var(--mut)}.admin-menu{display:flex;overflow-x:auto;gap:8px;padding:0 16px}.admin-menu button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 13px}.admin-menu button[aria-pressed="true"]{background:var(--navy);color:#fff}.admin-record{background:var(--card);border:1px solid var(--line);border-radius:15px;margin:9px 16px;padding:12px}.admin-record small{display:block;color:var(--mut)}.admin-record .acts button{border:1px solid var(--line);padding:7px 12px;border-radius:10px}.admin-record .acts .go{background:var(--gold);color:#fff}.admin-bars{display:flex;gap:6px;align-items:flex-end;height:84px}.admin-bars div{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--mut)}.admin-bars i{display:block;background:#8D59B1;border-radius:5px 5px 0 0;min-height:3px;margin-bottom:4px}
.empty{padding:55px 24px}.box,.ord,.item{box-shadow:0 5px 15px #3914530a}.buy{background:var(--gold);color:#fff}

body{background:#EFE6F7}.app{background:#F4EAFB}
.top{background:#F4EAFB;color:var(--navy);box-shadow:none;border-radius:0;padding:12px 16px 8px}
.topline{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.header-logo{display:block;width:148px;height:86px;object-fit:contain}

.header-brand-name{display:block;color:#3D195F;font-weight:700;font-size:12px;white-space:nowrap;margin-top:1px}
.header-brand-name small{display:block;font:600 8px/1.3 Arial,sans-serif;letter-spacing:.3px;color:#5D3980;margin-top:2px}

.header-icon{width:42px;height:42px;border-radius:50%;background:#E7D6F3;color:var(--navy);font-size:25px;display:grid;place-items:center}
.header-icon:first-child{justify-self:start}.header-icon:last-child{justify-self:end}
.banner-wrap{margin:9px 16px 20px}.banner{height:178px;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 9px 22px #35145621;background:#4b286b}

<body>
<div class="app">
  <header class="top"><div class="topline"><button class="header-icon" data-a="searchfocus" aria-label="البحث">⌕</button><span class="header-brand"><img class="header-logo" src="icons/brand-symbol.png" alt=""><span class="mini-flag" aria-hidden="true">Z</span><span class="header-brand-name">سوق الشطرة<small lang="en" dir="ltr">SOUQ AL-SHATRA</small></span></span><button class="header-icon" data-a="tab" data-v="account" aria-label="حسابي">♙</button></div></header>
  <main id="view"></main>
  <nav class="tabs" aria-label="التنقل">
    <button data-a="tab" data-v="market"><span class="navicon">⌂</span>الرئيسية</button>
    <button data-a="tab" data-v="categories"><span class="navicon">▦</span>الأقسام</button>
    <button data-a="tab" data-v="myMarket"><span class="navicon">🛒</span>سوقي<i id="cc" hidden></i></button>
    <button data-a="tab" data-v="chats"><span class="navicon">▣</span>محادثات</button>
    <button data-a="tab" data-v="account"><span class="navicon">♙</span>حسابي</button>
  </nav>
</div>
<div class="shade" id="shade" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="loading" class="loading-overlay" hidden role="status"><div class="loading-buddy"><span>✦</span></div><b>لحظة، نجهز سوق الشطرة…</b></div>
<div id="toast" hidden role="status"></div>

<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.0";
import {SUPABASE_URL,SUPABASE_ANON_KEY} from "./config.js";
async function apiFetch(resource,init={}){
  const controller=new AbortController(),source=init.signal||resource?.signal;
  const abort=()=>controller.abort();
  if(source?.aborted)abort();else source?.addEventListener('abort',abort,{once:true});
  const timer=setTimeout(abort,20000);
  try{return await fetch(resource,{...init,signal:controller.signal})}
  finally{clearTimeout(timer);source?.removeEventListener('abort',abort)}
}
const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{global:{fetch:apiFetch}});

const check=r=>{if(r.error)throw r.error;return r.data};
function withTimeout(promise,ms=24000){
  let timer;
  return Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Object.assign(new Error('انتهت مهلة الاتصال. تحقق من الإنترنت وأعد المحاولة.'),{name:'TimeoutError'})),ms)})]).finally(()=>clearTimeout(timer));
}
function error(e){toast(e?.name==='AbortError'||e?.name==='TimeoutError'?'انتهت مهلة الاتصال. تحقق من الإنترنت وأعد المحاولة.':'تعذّر إكمال العملية: '+(e?.message||e))}

const fromOrder=o=>({id:o.id,mid:o.store_id,items:(o.order_items||[]).map(i=>({pid:i.product_id,name:i.product_name,price:i.price,q:i.quantity})),total:o.total,st:Math.max(0,STCODE.indexOf(o.status)),ts:o.created_at,cust:{name:o.customer_name,phone:o.customer_phone,addr:o.address,note:o.note}});
async function refresh(){
  const id=++refreshId;
  const firstLoad=!D.p.length&&!user&&tab!=='welcome';
  if(firstLoad)$('#loading').hidden=false;
  try{
  const session=check(await withTimeout(db.auth.getSession()));
  const nextUser=session.session?.user||null;
  const [pr,ms,ps,rs]=await withTimeout(Promise.all([
    nextUser?db.from('profiles').select('*').eq('id',nextUser.id).single():Promise.resolve({data:null,error:null}),
    db.from('stores').select('*'),
    db.from('products').select('*').order('created_at',{ascending:false}),
    nextUser?db.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}):Promise.resolve({data:[],error:null})
  ]));
  const nextProfile=check(pr),stores=check(ms),products=check(ps),orders=check(rs);
  const people=nextProfile?.role==='admin'?check(await withTimeout(db.from('profiles').select('id,full_name,phone,role,disabled,created_at').order('created_at',{ascending:false}))):[];
  if(id!==refreshId)return;
  user=nextUser;profile=nextProfile;
  D.m=stores.map(m=>({id:m.id,name:m.name,phone:m.phone,ok:m.approved,removed:m.removed,owner_id:m.owner_id,created_at:m.created_at}));
  D.p=products.map(p=>({id:p.id,mid:p.store_id,name:p.name,desc:p.description,cat:p.category,price:p.price,stock:p.stock,img:p.image_path?db.storage.from('products').getPublicUrl(p.image_path).data.publicUrl:'',image_path:p.image_path,active:p.active,blocked:p.blocked}));
  ownStore=user?D.m.find(m=>m.owner_id===user.id):null;
  if(user&&!viewMode){try{viewMode=localStorage.getItem('souq-shatra-mode-'+user.id)||''}catch{};viewMode=viewMode||(ownStore?'seller':'buyer')}
  if(!user&&tab!=='welcome'&&viewMode!=='guest'){viewMode='';tab='welcome'}
  D.me=profile?.role==='admin'?'owner':ownStore?.id||null;
  D.o=orders.map(o=>({...fromOrder(o),buyer_id:o.buyer_id}));
  D.people=people;
  dataReady=true;
  D.cart=D.cart.filter(x=>D.p.some(p=>p.id===x.pid));save();render();
  }finally{if(id===refreshId)$('#loading').hidden=true}
}

function market(){

const A={
  enter:v=>{if(v==='guest'){rememberMode('guest');tab='market';render();scrollTo(0,0);return}rememberMode(v);if(user){tab=v==='seller'?'account':'market';render();return}lsheet('m')},
  switchrole:v=>{rememberMode(v);tab=v==='seller'?'account':'market';render();scrollTo(0,0)},
  tab:v=>{if(viewMode==='buyer'&&['listings','postPage'].includes(v)){toast('انتقل إلى وضع البائع من حسابي أولًا');return}tab=v;render();scrollTo(0,0)},
  adminTab:v=>{adminTab=v;admin()},
  cat:v=>{cat=v;market()},
  pickcat:v=>{cat=v;q='';tab='market';render();scrollTo(0,0)},
  allcat:()=>{cat='all';market()},
  searchfocus:()=>{tab='searchPage';render();setTimeout(()=>$('#q')?.focus(),0)},
  searchcat:v=>{q=val('q');filt.min=val('fmin');filt.max=val('fmax');cat=v;searchPage()},
  searchsort:v=>{q=val('q');filt.min=val('fmin');filt.max=val('fmax');filt.sort=v;searchPage()},
  searchapply:()=>{const min=val('fmin'),max=val('fmax');if((min&&+min<0)||(max&&+max<0)||(min&&max&&+min>+max)){toast('تحقق من حدود السعر');return}q=val('q');filt.min=min;filt.max=max;tab='market';render();scrollTo(0,0)},
  searchclear:()=>{q='';cat='all';filt.min='';filt.max='';filt.sort='newest';searchPage()},
  banner:v=>{bannerIndex=+v;updateBanner()},
  filters:filterSheet,
  fcat:v=>{cat=v;filterSheet()},
  fsort:v=>{filt.sort=v;filterSheet()},
  fapply:()=>{const min=val('fmin'),max=val('fmax');if((min&&+min<0)||(max&&+max<0)||(min&&max&&+min>+max)){toast('تحقق من حدود السعر');return}filt.min=min;filt.max=max;A.close();market()},
  fclear:()=>{cat='all';filt.min='';filt.max='';filt.sort='newest';A.close();market()},
  info:infoSheet,
  inforole:v=>{infoRole=v;infoSheet()},
  notifications:()=>sheet(head('الإشعارات')+'<div class="empty">لا توجد إشعارات حاليًا.</div>'),
  addentry:()=>{if(!user){A.enter('seller');return}if(profile?.disabled){toast('هذا الحساب معطّل');return}if(viewMode!=='seller'&&profile?.role!=='admin'){toast('انتقل إلى وضع البائع من حسابي أولًا');return}if(!ownStore){lsheet('store');return}if(ownStore.removed){toast('أزالت الإدارة هذا البائع من السوق');return}fsheet('')},
  close:()=>{$('#shade').hidden=true},
  prod:v=>{cur={p:prod(v),n:1};psheet()},
  pq:v=>{cur.n=Math.min(cur.p.stock||1,Math.max(1,cur.n+ +v));psheet()},
  add:()=>{const {p,n}=cur,c=D.cart.find(x=>x.pid===p.id);if(c)c.q=Math.min(p.stock,c.q+n);else D.cart.push({pid:p.id,q:n});save();A.close();render();toast('أُضيف للسلة')},
  cart:()=>csheet(),
  cq:v=>{const [id,d]=v.split('|'),c=D.cart.find(x=>x.pid===id),p=prod(id);c.q=Math.min(p.stock,c.q+ +d);if(c.q<1)D.cart=D.cart.filter(x=>x!==c);save();render();csheet()},
  order:()=>act(async()=>{
    if(!user||viewMode==='guest'){A.close();A.enter('buyer');toast('ادخل كزبون لإرسال الطلب');return}
    if(profile?.disabled){toast('هذا الحساب معطّل');return}
    const name=val('cn'),phone=val('cp').replace(/\D/g,''),addr=val('ca'),note=val('cno');
    if(name.length<2||addr.length<3||!/^\d{10,11}$/.test(phone)){toast('اكتب الاسم ورقم هاتف صحيح والعنوان');return}
    const groups=new Map();for(const c of D.cart){const p=prod(c.pid);if(!p)continue;if(!groups.has(p.mid))groups.set(p.mid,[]);groups.get(p.mid).push({id:p.id,quantity:c.q})}
    const ids=[];for(const [store,lines] of groups){
      const id=check(await db.rpc('place_order',{p_store:store,p_lines:lines,p_name:name,p_phone:phone,p_address:addr,p_note:note}));
      ids.push('#'+id.slice(-4).toUpperCase());D.cart=D.cart.filter(c=>!lines.some(l=>l.id===c.pid));save();
    }
    D.cust={name,phone,addr};save();await refresh();
    sheet(`<div class="done"><div class="ck" aria-hidden="true">✓</div><h2>وصل طلبك</h2><p class="note">رقم الطلب ${ids.join('، ')}<br>سيتصل بك التاجر للتأكيد. الدفع عند الاستلام.</p><button class="buy" data-a="close">تم</button></div>`);
  }),
  login:v=>lsheet(v),
  dologin:m=>act(async()=>{
    const email=val('lp'),password=val('lk');if(!email.includes('@')||password.length<6){toast('اكتب البريد وكلمة مرور من 6 أحرف على الأقل');return}
    const button=$('#sheet [data-a="dologin"]');
    if(button.disabled)return;
    button.disabled=true;button.textContent='جارٍ الاتصال…';
    try{
      let signedIn;
      if(m==='r'){
        const name=val('ln');if(name.length<2){toast('اكتب اسمك');return}
        const data=check(await withTimeout(db.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:location.origin+location.pathname}})));
        if(!data.session){A.close();toast('تحقق من بريدك الإلكتروني، ثم سجّل الدخول');return}
        signedIn=data.user;
      }else signedIn=check(await withTimeout(db.auth.signInWithPassword({email,password}))).user;
      user=signedIn;rememberMode(viewMode==='seller'?'seller':'buyer');profile=null;ownStore=null;dt='m';tab=viewMode==='seller'?'account':'market';A.close();render();toast('تم الدخول');
      refresh().catch(error);
    }finally{
      if(button.isConnected){button.disabled=false;button.textContent=m==='r'?'إنشاء الحساب':'دخول'}
    }
  }),
  register:()=>act(async()=>{
    if(!user)return;
    const name=val('ln'),phone=val('lp').replace(/\D/g,'');if(name.length<2||phone.length<10){toast('اكتب اسم المتجر ورقم الهاتف');return}
    check(await db.rpc('register_store',{p_name:name,p_phone:phone,p_address:'',p_description:'',p_social_url:''}));
    await refresh();dt='p';A.close();render();toast('تم تسجيل المتجر. ينتظر موافقة الإدارة');
  }),
  out:()=>act(async()=>{check(await db.auth.signOut());user=null;profile=null;ownStore=null;viewMode='';tab='welcome';dt='p';render();refresh().catch(error)}),
  dtab:v=>{dt=v;render()},
  pform:v=>{if(viewMode!=='seller'&&profile?.role!=='admin'){toast('انتقل إلى وضع البائع من حسابي أولًا');return}fsheet(v)},
  psave:()=>act(async()=>{
    if(!ownStore){toast('سجّل متجرًا أولًا');return}
    const name=val('fn'),price=+val('fpr'),stock=+val('fs');
    if(name.length<2||!(price>0)||!(stock>=0)||val('fs')===''){toast('اكتب الاسم والسعر والكمية');return}
    let image_path=cur.id?prod(cur.id)?.image_path:null;
    if(cur.img&&cur.img.startsWith('data:image/')){
      const blob=await (await fetch(cur.img)).blob();if(blob.size>2097152)throw Error('الصورة كبيرة؛ اختر صورة أصغر');
      image_path=`${ownStore.id}/${uid()}.jpg`;
      check(await db.storage.from('products').upload(image_path,blob,{contentType:'image/jpeg'}));
    }
    const f={name,price,stock,category:$('#fc').value,description:val('fd'),image_path,store_id:ownStore.id};
    if(cur.id)check(await db.from('products').update(f).eq('id',cur.id));else check(await db.from('products').insert(f));
    tab='listings';await refresh();A.close();render();toast('تم حفظ المنتج');
  }),
  pdel:v=>ask('حذف هذا المنتج؟','pdel2',v),
  pdel2:v=>act(async()=>{check(await db.from('products').delete().eq('id',v));await refresh();A.close();render()}),
  st:v=>act(async()=>{const o=D.o.find(x=>x.id===v);if(!o)return;check(await db.rpc('set_order_status',{p_order:v,p_status:STCODE[Math.min(3,o.st+1)]}));await refresh()}),
  cancel:v=>ask('إلغاء هذا الطلب؟','cancel2',v),
  cancel2:v=>act(async()=>{check(await db.rpc('set_order_status',{p_order:v,p_status:'cancelled'}));await refresh();A.close();render()}),
  mok:v=>act(async()=>{const m=mrec(v);check(await db.rpc('approve_store',{p_store:v,p_approved:!m.ok}));await refresh()}),
  userDisableAsk:v=>{if(profile?.role!=='admin')return;const p=D.people.find(x=>x.id===v);if(!p||p.role==='admin')return;ask(p.disabled?'إعادة تفعيل هذا الحساب؟':'تعطيل هذا الحساب ومنعه من الطلب أو البيع؟ ستبقى الطلبات السابقة محفوظة.','userDisable2',v)},
  userDisable2:v=>act(async()=>{if(profile?.role!=='admin')return;const p=D.people.find(x=>x.id===v);if(!p)return;check(await db.rpc('admin_set_account_disabled',{p_user:v,p_disabled:!p.disabled}));A.close();await refresh();toast('تم تحديث الحساب')}),
  storeRemoveAsk:v=>{if(profile?.role!=='admin')return;const m=mrec(v);if(!m.id)return;ask(m.removed?'إعادة هذا البائع إلى قائمة المراجعة؟ ستحتاج إلى قبوله من جديد.':'إزالة هذا البائع ومنتجاته من السوق؟ تبقى الطلبات السابقة محفوظة.','storeRemove2',v)},
  storeRemove2:v=>act(async()=>{if(profile?.role!=='admin')return;const m=mrec(v);check(await db.rpc('admin_set_store_removed',{p_store:v,p_removed:!m.removed}));A.close();await refresh();toast('تم تحديث البائع')}),
  productBlockAsk:v=>{if(profile?.role!=='admin')return;const p=prod(v);if(!p)return;ask(p.blocked?'إعادة هذا المنتج للظهور إذا كان متجره معتمدًا؟':'إزالة هذا المنتج من السوق؟ ستبقى تفاصيل الطلبات السابقة محفوظة.','productBlock2',v)},
  productBlock2:v=>act(async()=>{if(profile?.role!=='admin')return;const p=prod(v);check(await db.rpc('admin_set_product_blocked',{p_product:v,p_blocked:!p.blocked}));A.close();await refresh();toast('تم تحديث المنتج')}),
  adminAcceptAsk:v=>{if(profile?.role==='admin')ask('تحديث حالة هذا الطلب إلى مقبول؟','adminAccept2',v)},
  adminAccept2:v=>act(async()=>{if(profile?.role!=='admin')return;check(await db.rpc('set_order_status',{p_order:v,p_status:'accepted'}));A.close();await refresh();toast('تم قبول الطلب')}),
  adminCancelAsk:v=>{if(profile?.role==='admin')ask('إلغاء هذا الطلب وإعادة الكمية إلى المخزون؟','adminCancel2',v)},
  adminCancel2:v=>act(async()=>{if(profile?.role!=='admin')return;check(await db.rpc('set_order_status',{p_order:v,p_status:'cancelled'}));A.close();await refresh();toast('تم إلغاء الطلب')}),
  comm:()=>{toast('إعداد العمولة يحتاج تفعيلًا في قاعدة البيانات')}

};
document.addEventListener('click',e=>{
  if(e.target.id==='shade'){A.close();return}
  const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v);
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='pimg'||!e.target.files[0])return;
  const im=new Image();im.onload=()=>{const s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cur.img=c.toDataURL('image/jpeg',.72);$('#pv').innerHTML=`<img src="${cur.img}" alt="">`;updatePostProgress()};
  im.src=URL.createObjectURL(e.target.files[0]);
});
document.addEventListener('input',e=>{if(['fn','fpr','fs','fd'].includes(e.target.id))updatePostProgress()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')A.close()});
function updateBanner(){const banner=$('.banner');if(!banner)return;banner.querySelector('img').src=BANNERS[bannerIndex][0];banner.querySelector('.banner-caption').textContent=BANNERS[bannerIndex][1];document.querySelectorAll('.banner-dots button').forEach((b,i)=>b.setAttribute('aria-current',String(i===bannerIndex)))}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{if(tab==='market'&&!document.hidden){bannerIndex=(bannerIndex+1)%BANNERS.length;updateBanner()}},5500);
render();refresh().catch(error);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
